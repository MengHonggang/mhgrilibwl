<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课堂积分系统 - 五种模式 + 分组底色 + 红旗 + 加油拳头 + 个人分数</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:linear-gradient(145deg,#f0f4ff 0%,#e6edf7 100%); min-height:100vh; padding:16px 24px 20px; user-select:none; overflow-x:hidden; }
        button { cursor:pointer; font-family:inherit; border:none; outline:none; transition:all 0.2s; }
        button:active { transform:scale(0.95); }
        .top-bar { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.70); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:14px 28px; border-radius:20px; box-shadow:0 8px 32px rgba(0,20,50,0.08); margin-bottom:16px; flex-wrap:wrap; gap:12px; }
        .quote-area { font-size:22px; font-weight:600; color:#1a2b4a; display:flex; align-items:center; gap:12px; flex:1; min-width:200px; }
        .quote-icon { font-size:28px; }
        .quote-text { font-style:italic; background:linear-gradient(135deg,#1a2b4a,#2d4a7a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .countdown-area { font-size:26px; font-weight:700; color:#c0392b; background:rgba(192,57,43,0.10); padding:6px 24px; border-radius:40px; white-space:nowrap; border:2px solid rgba(192,57,43,0.20); letter-spacing:1px; display:flex; align-items:center; gap:8px; }
        .countdown-area .cd-icon { font-size:28px; }
        .btn-start-wrapper { display:flex; justify-content:center; margin-bottom:14px; gap:14px; flex-wrap:wrap; }
        .btn-start { font-size:20px; font-weight:700; padding:13px 32px; border-radius:50px; color:#fff; letter-spacing:2px; transition:all 0.3s; min-width:150px; }
        .btn-start:hover { transform:translateY(-2px); }
        .btn-start:disabled { background:#a0b8d0 !important; box-shadow:none !important; transform:none; cursor:not-allowed; }
        .btn-start.quiz { background:linear-gradient(135deg,#4a7ec9,#2d5aa0); box-shadow:0 8px 28px rgba(45,90,160,0.35); }
        .btn-start.quiz:hover:not(:disabled) { box-shadow:0 12px 36px rgba(45,90,160,0.45); }
        .btn-start.correction { background:linear-gradient(135deg,#9b59b6,#8e44ad); box-shadow:0 8px 28px rgba(142,68,173,0.35); }
        .btn-start.correction:hover:not(:disabled) { box-shadow:0 12px 36px rgba(142,68,173,0.45); }
        .btn-start.comment { background:linear-gradient(135deg,#27ae60,#229954); box-shadow:0 8px 28px rgba(34,153,84,0.35); }
        .btn-start.comment:hover:not(:disabled) { box-shadow:0 12px 36px rgba(34,153,84,0.45); }
        .btn-start.optimal { background:linear-gradient(135deg,#e67e22,#d35400); box-shadow:0 8px 28px rgba(211,84,0,0.35); }
        .btn-start.optimal:hover:not(:disabled) { box-shadow:0 12px 36px rgba(211,84,0,0.45); }
        .btn-start.adapt { background:linear-gradient(135deg,#16a085,#0e7866); box-shadow:0 8px 28px rgba(14,120,102,0.35); }
        .btn-start.adapt:hover:not(:disabled) { box-shadow:0 12px 36px rgba(14,120,102,0.45); }
        .main-area { display:flex; gap:20px; min-height:520px; }
        .main-display { position:relative; flex:1; background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:24px; box-shadow:0 8px 40px rgba(0,20,50,0.10); padding:24px 28px 20px; min-height:480px; display:flex; flex-direction:column; transition:all 0.3s; border:2px solid rgba(255,255,255,0.40); }
        .display-title { font-size:20px; font-weight:600; color:#2c3e50; text-align:center; margin-bottom:10px; letter-spacing:2px; }
        .display-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
        .countdown-big { font-size:120px; font-weight:900; color:#2d5aa0; text-shadow:0 4px 20px rgba(45,90,160,0.20); line-height:1; animation:pulse 1s ease-in-out infinite; }
        .countdown-big .label { font-size:40px; font-weight:600; color:#4a7ec9; display:block; margin-bottom:10px; animation:none; }
        @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
        .seating-wrapper { width:100%; position:relative; padding:4px 0; }
        .seating-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; width:100%; position:relative; }
        .seat-cell { border-radius:10px; padding:6px 2px; text-align:center; font-size:18px; font-weight:600; color:#1a2b4a; box-shadow:0 2px 8px rgba(0,0,0,0.04); border:3px solid transparent; transition:all 0.15s; position:relative; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; word-break:keep-all; cursor:pointer; background:rgba(255,255,255,0.80); line-height:1.2; }
        .seat-cell .cell-name { display:block; }
        /* ===== 个人分数显示 ===== */
        .seat-cell .cell-score { display:none; font-size:11px; font-weight:700; color:#2d5aa0; line-height:1.2; margin-top:2px; }
        .seat-cell.show-score .cell-score { display:block; }
        .seat-cell.empty { background:transparent !important; box-shadow:none; border-color:transparent; color:transparent; pointer-events:none; cursor:default; }
        .seat-cell.highlight { border-color:#e74c3c; box-shadow:0 0 0 4px rgba(231,76,60,0.30),0 0 20px rgba(231,76,60,0.25); transform:scale(1.02); z-index:5; transition:all 0.10s ease; }
        .seat-cell.locked { border-color:#f39c12; box-shadow:0 0 0 4px rgba(243,156,18,0.40),0 0 30px rgba(243,156,18,0.30); transform:scale(1.04); z-index:6; background:rgba(255,243,200,0.80) !important; }
        .seat-cell .order-badge { position:absolute; top:-8px; right:-8px; background:#e74c3c; color:#fff; border-radius:50%; width:24px; height:24px; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.2); z-index:10; }
        .action-btns-wrapper { position:absolute; display:flex; align-items:center; gap:14px; z-index:20; pointer-events:none; transition:opacity 0.25s; }
        .action-btns-wrapper.hidden { opacity:0; pointer-events:none; }
        .action-btn { width:50px; height:50px; border-radius:50%; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(0,0,0,0.18); pointer-events:auto; border:3px solid rgba(255,255,255,0.6); transition:all 0.15s; color:#fff; line-height:1; }
        .action-btn:hover { transform:scale(1.10); }
        .action-btn.btn-yes { background:linear-gradient(135deg,#27ae60,#2ecc71); }
        .action-btn.btn-no { background:linear-gradient(135deg,#e74c3c,#c0392b); }
        .action-btn.btn-cancel { background:#95a5a6; color:#fff; }
        .action-btn.btn-score { font-size:22px !important; font-weight:800 !important; letter-spacing:0; }
        .score-fly { position:absolute; font-size:34px; font-weight:900; z-index:30; pointer-events:none; animation:flyUp 1.6s ease-out forwards; text-shadow:0 2px 12px rgba(0,0,0,0.15); }
        .score-fly.plus { color:#27ae60; text-shadow:0 2px 12px rgba(39,174,96,0.35); }
        .score-fly.minus { color:#e74c3c; text-shadow:0 2px 12px rgba(231,76,60,0.35); }
        .score-fly.plus1, .score-fly.minus1 { font-size:26px; }
        @keyframes flyUp { 0% { opacity:1; transform:translateY(0) scale(0.8); } 30% { opacity:1; transform:translateY(-20px) scale(1.2); } 100% { opacity:0; transform:translateY(-90px) scale(1); } }
        .btn-random { font-size:20px; font-weight:700; padding:10px 32px; border-radius:40px; background:linear-gradient(135deg,#e67e22,#f39c12); color:#fff; box-shadow:0 6px 24px rgba(243,156,18,0.35); margin-top:16px; align-self:flex-end; transition:all 0.25s; letter-spacing:2px; }
        .btn-random:hover { transform:translateY(-2px) scale(1.02); box-shadow:0 10px 32px rgba(243,156,18,0.45); }
        .btn-random:disabled { background:#b0b8c8; box-shadow:none; transform:none; cursor:not-allowed; }
        .btn-random.hidden { display:none; }
        .leaderboard { width:220px; min-width:180px; background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:24px; box-shadow:0 8px 40px rgba(0,20,50,0.10); padding:20px 14px 18px; border:2px solid rgba(255,255,255,0.40); display:flex; flex-direction:column; max-height:580px; overflow-y:auto; }
        .leaderboard h3 { font-size:22px; font-weight:700; color:#1a2b4a; text-align:center; margin-bottom:16px; letter-spacing:2px; border-bottom:3px solid rgba(45,90,160,0.15); padding-bottom:12px; }
        /* ===== 积分榜不换行，字体缩小 ===== */
        .lb-item { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; margin-bottom:4px; border-radius:12px; font-size:16px; font-weight:500; color:#1a2b4a; transition:background 0.2s; background:rgba(255,255,255,0.30); white-space:nowrap; overflow:hidden; }
        .lb-item .rank { font-weight:700; color:#7f8c8d; margin-right:6px; font-size:14px; flex-shrink:0; }
        .lb-item .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:16px; }
        .lb-item .score { font-weight:700; color:#2d5aa0; background:rgba(45,90,160,0.08); padding:0 8px; border-radius:20px; font-size:14px; flex-shrink:0; margin-left:6px; white-space:nowrap; }
        .lb-item.top1 { background:rgba(255,215,0,0.20); }
        .lb-item.top1 .rank { color:#f39c12; }
        .lb-item.top2 { background:rgba(192,192,192,0.15); }
        .lb-item.top2 .rank { color:#95a5a6; }
        .lb-item.top3 { background:rgba(205,127,50,0.12); }
        .lb-item.top3 .rank { color:#d35400; }
        .lb-empty { text-align:center; color:#95a5a6; font-size:16px; padding:30px 0; }
        .footer-toolbar { margin-top:16px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
        .footer-toolbar button { font-size:16px; font-weight:600; padding:10px 26px; border-radius:30px; background:rgba(255,255,255,0.70); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#1a2b4a; box-shadow:0 4px 16px rgba(0,0,0,0.04); border:2px solid rgba(255,255,255,0.50); transition:all 0.2s; }
        .footer-toolbar button:hover { background:rgba(255,255,255,0.90); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,20,50,0.10); }
        .footer-toolbar button.danger { color:#c0392b; border-color:rgba(192,57,43,0.25); }
        .footer-toolbar button.danger:hover { background:rgba(192,57,43,0.08); border-color:rgba(192,57,43,0.40); }
        /* 显示分数按钮激活状态 */
        #btnToggleScores.active { background:linear-gradient(135deg,#4a7ec9,#2d5aa0); color:#fff; border-color:transparent; box-shadow:0 4px 16px rgba(45,90,160,0.30); }
        #btnToggleScores.active:hover { background:linear-gradient(135deg,#5a8ed9,#3d6ab0); box-shadow:0 8px 24px rgba(45,90,160,0.40); }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:999; padding:20px; }
        .modal-overlay.active { display:flex; }
        .modal-box { background:#fff; border-radius:28px; padding:30px 34px 34px; max-width:860px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,0.30); animation:modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity:0; transform:scale(0.94) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-box h2 { font-size:26px; color:#1a2b4a; margin-bottom:18px; text-align:center; letter-spacing:2px; }
        .modal-box .hint { font-size:15px; color:#7f8c8d; text-align:center; margin-bottom:16px; }
        .modal-edit-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-bottom:20px; }
        .modal-edit-grid input { width:100%; padding:6px 2px; border:2px solid #dce3ed; border-radius:6px; font-size:15px; text-align:center; font-weight:500; color:#1a2b4a; background:#f8faff; transition:border 0.2s; font-family:inherit; }
        .modal-edit-grid input:focus { border-color:#4a7ec9; outline:none; background:#fff; }
        .modal-edit-grid input.empty-input { background:#f0f2f5; color:#b0b8c8; }
        .modal-actions { display:flex; justify-content:flex-end; gap:14px; margin-top:6px; }
        .modal-actions button { font-size:18px; font-weight:600; padding:10px 34px; border-radius:40px; transition:all 0.2s; }
        .modal-actions .btn-save { background:linear-gradient(135deg,#27ae60,#2ecc71); color:#fff; box-shadow:0 4px 16px rgba(39,174,96,0.30); }
        .modal-actions .btn-save:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(39,174,96,0.40); }
        .modal-actions .btn-cancel { background:#ecf0f1; color:#2c3e50; }
        .modal-actions .btn-cancel:hover { background:#dde1e3; }
        .count-selector { display:flex; gap:12px; justify-content:center; margin:20px 0; flex-wrap:wrap; }
        .count-selector button { font-size:22px; font-weight:700; padding:12px 26px; border-radius:16px; background:linear-gradient(135deg,#4a7ec9,#2d5aa0); color:#fff; box-shadow:0 4px 16px rgba(45,90,160,0.25); transition:all 0.2s; min-width:60px; }
        .count-selector button:hover { transform:scale(1.05); box-shadow:0 8px 28px rgba(45,90,160,0.35); }
        .count-selector button:active { transform:scale(0.95); }
        .status-hint { font-size:22px; color:#7f8c8d; font-weight:500; letter-spacing:2px; text-align:center; }
        .status-hint .emoji { font-size:48px; display:block; margin-bottom:8px; }
        .seating-wrapper.hidden { display:none; }
        .countdown-big-wrapper { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; min-height:300px; }
        .countdown-big-wrapper.hidden { display:none; }
        .info-panel { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; min-height:300px; padding:20px; }
        .info-panel.hidden { display:none; }
        .info-content { font-size:26px; line-height:2; color:#2c3e50; text-align:left; font-weight:600; white-space:pre-line; background:rgba(255,255,255,0.60); padding:24px 40px; border-radius:20px; border-left:6px solid #4a7ec9; box-shadow:0 4px 20px rgba(0,0,0,0.05); max-width:90%; }
        .btn-goto-panel { margin-top:30px; font-size:22px; font-weight:700; padding:14px 48px; border-radius:50px; background:linear-gradient(135deg,#4a7ec9,#2d5aa0); color:#fff; box-shadow:0 8px 28px rgba(45,90,160,0.35); letter-spacing:2px; }
        .btn-goto-panel:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(45,90,160,0.45); }
        .debug-toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 24px; border-radius:30px; font-size:16px; z-index:9999; display:none; pointer-events:none; }
        .multi-progress { font-size:18px; font-weight:600; color:#2d5aa0; margin-top:8px; text-align:center; }
        #flagContainer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:15; overflow:visible; }
        .flag-icon { position:absolute; font-size:40px; opacity:0.7; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3)); transform:translate(-50%,-50%); z-index:25; pointer-events:none; transition:all 0.3s; }
        .fist-icon { position:absolute; font-size:40px; opacity:0.7; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3)); transform:translate(-50%,-50%); z-index:25; pointer-events:none; transition:all 0.3s; }
        .fist-toggle { position:fixed; bottom:10px; left:10px; font-size:12px; padding:5px 12px; border-radius:14px; background:rgba(255,255,255,0.45); color:#b0b8c8; border:1px solid rgba(0,0,0,0.06); cursor:pointer; opacity:0.35; transition:all 0.25s; z-index:100; font-family:inherit; letter-spacing:1px; }
        .fist-toggle:hover { opacity:1; background:rgba(255,255,255,0.95); color:#7f8c8d; transform:none; }
        .fist-toggle.off { opacity:0.20; color:#ccc; }
        .fist-toggle.off::after { content:''; position:absolute; top:50%; left:10%; width:80%; height:2px; background:#c0392b; transform:rotate(-8deg); border-radius:2px; }
        @media (max-width:900px) { .main-area { flex-direction:column; } .leaderboard { width:100%; max-height:260px; min-width:unset; flex-direction:row; flex-wrap:wrap; padding:14px 18px; } .leaderboard h3 { width:100%; margin-bottom:8px; padding-bottom:8px; font-size:18px; } .lb-item { flex:0 0 calc(50% - 6px); font-size:16px; padding:6px 10px; } .lb-item .name { font-size:16px; } .top-bar { flex-direction:column; align-items:stretch; text-align:center; padding:12px 16px; } .quote-area { font-size:18px; justify-content:center; } .countdown-area { font-size:20px; justify-content:center; padding:4px 16px; } .btn-start { font-size:15px; padding:10px 22px; min-width:110px; letter-spacing:1px; } .seat-cell { font-size:14px; padding:6px 2px; min-height:44px; } .seating-grid { gap:4px; } .countdown-big { font-size:80px; } .countdown-big .label { font-size:28px; } .action-btn { width:40px; height:40px; font-size:22px; } .modal-box { padding:20px 16px; } .modal-edit-grid { gap:3px; } .modal-edit-grid input { font-size:13px; padding:4px 2px; } .info-content { font-size:20px; padding:18px 24px; } }
        @media (max-width:500px) { .seat-cell { font-size:11px; padding:3px 1px; min-height:36px; border-radius:4px; } .seat-cell .cell-score { font-size:9px; } .seating-grid { gap:2px; } .countdown-big { font-size:56px; } .countdown-big .label { font-size:20px; } .btn-start { font-size:12px; padding:8px 14px; min-width:88px; letter-spacing:0; } .action-btn { width:32px; height:32px; font-size:16px; } .leaderboard .lb-item { font-size:13px; flex:0 0 100%; padding:5px 8px; } .leaderboard .lb-item .name { font-size:13px; } .leaderboard .lb-item .score { font-size:12px; } .modal-edit-grid { grid-template-columns:repeat(5,1fr); } .top-bar .quote-area { font-size:15px; } .countdown-area { font-size:16px; } .info-content { font-size:16px; padding:14px 18px; } .btn-goto-panel { font-size:18px; padding:12px 32px; } }
        .leaderboard::-webkit-scrollbar { width:4px; }
        .leaderboard::-webkit-scrollbar-track { background:rgba(0,0,0,0.04); border-radius:4px; }
        .leaderboard::-webkit-scrollbar-thumb { background:rgba(45,90,160,0.25); border-radius:4px; }
        .modal-box::-webkit-scrollbar { width:4px; }
        .modal-box::-webkit-scrollbar-track { background:rgba(0,0,0,0.04); border-radius:4px; }
        .modal-box::-webkit-scrollbar-thumb { background:rgba(45,90,160,0.20); border-radius:4px; }
    </style>
</head>
<body>

    <!-- ===== 顶部栏 ===== -->
    <header class="top-bar">
        <div class="quote-area">
            <span class="quote-icon">📖</span>
            <span class="quote-text" id="quoteDisplay">今日名言加载中…</span>
        </div>
        <div class="countdown-area">
            <span class="cd-icon">⏳</span>
            <span id="examCountdown">距高考还有 --- 天</span>
        </div>
    </header>

    <!-- ===== 开始按钮组（五个） ===== -->
    <div class="btn-start-wrapper">
        <button class="btn-start quiz" id="btnStartQuiz">🚀 答题得分</button>
        <button class="btn-start correction" id="btnStartCorrection">✍️ 纠错得分</button>
        <button class="btn-start comment" id="btnStartComment">💬 讲评得分</button>
        <button class="btn-start optimal" id="btnStartOptimal">⭐ 优解得分</button>
        <button class="btn-start adapt" id="btnStartAdapt">📝 改编得分</button>
    </div>

    <!-- ===== 主区域 ===== -->
    <div class="main-area">
        <div class="main-display" id="mainDisplay">
            <div class="display-title" id="displayTitle">📢 选择活动模式</div>
            <div class="display-content" id="displayContent">
                <div class="countdown-big-wrapper" id="countdownWrapper">
                    <div class="countdown-big">
                        <span class="label" id="countdownLabel">⏱ 倒计时</span>
                        <span id="countdownNumber">10</span>
                    </div>
                </div>
                <div class="seating-wrapper hidden" id="seatingWrapper">
                    <div class="seating-grid" id="seatingGrid"></div>
                    <div id="flagContainer"></div>
                    <div style="display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; justify-content:flex-end;">
                        <div class="multi-progress" id="multiProgress"></div>
                        <button class="btn-random" id="btnRandom">🎲 随机指定</button>
                    </div>
                </div>
                <div class="info-panel hidden" id="infoPanel">
                    <div class="info-content" id="infoContent"></div>
                    <button class="btn-goto-panel" id="btnGotoPanel">📊 得分面板</button>
                </div>
                <div id="idleState" class="status-hint">
                    <span class="emoji">🙌</span>
                    点击上方按钮选择活动模式
                </div>
            </div>
            <div class="action-btns-wrapper hidden" id="actionBtns"></div>
        </div>
        <div class="leaderboard" id="leaderboard">
            <h3>🏆 积分榜</h3>
            <div id="lbList"><div class="lb-empty">暂无积分数据</div></div>
        </div>
    </div>

    <!-- ===== 底部工具栏 ===== -->
    <div class="footer-toolbar">
        <button id="btnEditSeating">📝 编辑座次表</button>

    <!-- ===== 编辑座次表模态框 ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2>📝 编辑座次表</h2>
            <p class="hint">双击单元格可编辑，空单元格留空即可。修改后点击「保存」。</p>
            <div class="modal-edit-grid" id="editGrid"></div>
            <div class="modal-actions">

    <!-- ===== 人数选择模态框 ===== -->
    <div class="modal-overlay" id="countModal">
        <div class="modal-box" style="max-width:620px;">
            <h2>👥 选择随机人数</h2>

                <button class="btn-cancel" id="btnCountCancel">取消</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display:none" />
    <div class="debug-toast" id="debugToast"></div>

    <script>
        // ================================================================
        //  1. 数据
        // ================================================================
        const DEFAULT_SEATING = [
            ['', '', '张英潭', '马婧媛', '支童欣', '李嘉雪', '梁若琳', '', '', ''],
            ['王若琪', '吴玮琦', '王馨逸', '李语琪', '王艺萌', '郝雅露', '赵嘉怡', '李思梦', '孟雨涵', '张笑笑'],
            ['赵恩彤', '桑子萱', '岳梦瑶', '董欣娜', '张沛萱', '刘鑫雅', '吴雨炫', '王司奕', '缪馨雅', '李雪铷'],
            ['马欣悦', '田佳悦', '郭雅馨', '韩梦洁', '杨雨欣', '胡心琳', '常靖雯', '占雪莉', '赵家伊', '周雅雯'],
            ['段峻熙', '李施禹', '周志辉', '梁书楷', '王晨旭', '张博文', '李衍程', '张琪毓', '张鹏飞', '张洪宇'],
            ['韩雨卓', '耿洪顺', '赵恪材', '王星奥', '张恒豪', '岳彩博', '滕陈钦毅', '谢育航', '陈浩楠', '陈志远'],
            ['王旭', '褚雨恒', '洪久程', '江瑞阳', '刘子豪', '曹钰', '', '', '', '']
        ];

        const GROUP_MAP = {
            '王若琪':1,'赵恩彤':1,'马欣悦':1,'吴玮琦':1,'桑子萱':1,'田佳悦':1,
            '段峻熙':2,'韩雨卓':2,'王旭':2,'李施禹':2,'耿洪顺':2,'褚雨恒':2,
            '张英潭':3,'王馨逸':3,'马婧媛':3,'李语琪':3,'支童欣':3,'王艺萌':3,'李嘉雪':3,'郝雅露':3,
            '岳梦瑶':4,'郭雅馨':4,'董欣娜':4,'韩梦洁':4,'张沛萱':4,'杨雨欣':4,'刘鑫雅':4,'胡心琳':4,
            '周志辉':5,'赵恪材':5,'梁书楷':5,'王星奥':5,'王晨旭':5,'张恒豪':5,'张博文':5,'岳彩博':5,
            '洪久程':6,'江瑞阳':6,'刘子豪':6,'曹钰':6,'滕陈钦毅':6,'谢育航':6,'陈浩楠':6,'陈志远':6,
            '梁若琳':7,'赵嘉怡':7,'吴雨炫':7,'李思梦':7,'王司奕':7,'孟雨涵':7,'缪馨雅':7,'张笑笑':7,'李雪铷':7,
            '常靖雯':8,'李衍程':8,'占雪莉':8,'张琪毓':8,'赵家伊':8,'张鹏飞':8,'周雅雯':8,'张洪宇':8
        };

        const GROUP_COLORS = [
            '#FFE6E6','#E6F0FF','#E6FFE6','#FFF5E6','#F5E6FF','#FFE6F0','#E6FFF5','#FFFFE6'
        ];

        const QUOTES = [
            '书山有路勤为径，学海无涯苦作舟。','宝剑锋从磨砺出，梅花香自苦寒来。','天道酬勤，厚积薄发。',
            '青春须早为，岂能长少年。','志当存高远，路自脚下行。','不积跬步，无以至千里。',
            '学如逆水行舟，不进则退。','少年易学老难成，一寸光阴不可轻。','长风破浪会有时，直挂云帆济沧海。',
            '千淘万漉虽辛苦，吹尽狂沙始到金。','博学之，审问之，慎思之，明辨之，笃行之。',
            '业精于勤，荒于嬉；行成于思，毁于随。','古之立大事者，不惟有超世之才，亦必有坚忍不拔之志。',
            '天行健，君子以自强不息。','有志者，事竟成。','锲而不舍，金石可镂。',
            '敏而好学，不耻下问。','学而不思则罔，思而不学则殆。','温故而知新，可以为师矣。',
            '三人行，必有我师焉。','发奋识遍天下字，立志读尽人间书。','黑发不知勤学早，白首方悔读书迟。',
            '少壮不努力，老大徒伤悲。','读书破万卷，下笔如有神。','会当凌绝顶，一览众山小。'
        ];

        const STORAGE_KEY_SEATING = 'classroom_seating';
        const STORAGE_KEY_SCORES = 'classroom_scores';
        const STORAGE_KEY_FIST = 'classroom_show_fist';
        const COLS = 10;
        const ORDER_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧'];

        // ================================================================
        //  2. 状态变量
        // ================================================================
        let seatingData = [], scores = {}, allNames = [];
        let currentState = 'idle';
        let countdownTimer = null, randomTimer = null;
        let lockedCell = null;
        let multiLockedCells = [];
        let multiCurrentIndex = 0;
        let isProcessing = false;
        let isMultiMode = false;
        let activityMode = 'quiz';
        let showFist = (localStorage.getItem(STORAGE_KEY_FIST) !== '0');
        // 【新增】是否显示个人分数
        let showIndividualScores = false;

        // ================================================================
        //  3. DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);
        const quoteDisplay = $('quoteDisplay'), examCountdown = $('examCountdown');
        const btnStartQuiz = $('btnStartQuiz'), btnStartCorrection = $('btnStartCorrection'), btnStartComment = $('btnStartComment'), btnStartOptimal = $('btnStartOptimal'), btnStartAdapt = $('btnStartAdapt');
        const allStartButtons = [btnStartQuiz, btnStartCorrection, btnStartComment, btnStartOptimal, btnStartAdapt];
        const displayTitle = $('displayTitle'), displayContent = $('displayContent');
        const countdownWrapper = $('countdownWrapper'), countdownNumber = $('countdownNumber'), countdownLabel = $('countdownLabel');
        const seatingWrapper = $('seatingWrapper'), seatingGrid = $('seatingGrid'), btnRandom = $('btnRandom');
        const idleState = $('idleState'), actionBtns = $('actionBtns'), lbList = $('lbList');
        const infoPanel = $('infoPanel'), infoContent = $('infoContent'), btnGotoPanel = $('btnGotoPanel');
        const editModal = $('editModal'), editGrid = $('editGrid'), btnModalCancel = $('btnModalCancel'), btnModalSave = $('btnModalSave');
        const countModal = $('countModal'), btnCountCancel = $('btnCountCancel');
        const btnEditSeating = $('btnEditSeating'), btnToggleScores = $('btnToggleScores'), btnResetScores = $('btnResetScores');
        const btnExportData = $('btnExportData'), btnImportData = $('btnImportData'), fileInput = $('fileInput');
        const debugToast = $('debugToast');
        const multiProgress = $('multiProgress');
        const flagContainer = $('flagContainer');
        const btnToggleFist = $('btnToggleFist');

        // ================================================================
        //  4. 工具函数
        // ================================================================
        function getAllNamesFromData(data) { const names=[]; for(const row of data) for(const cell of row) if(cell && cell.trim()!=='') names.push(cell.trim()); return names; }
        function getSeatingData() { const stored=localStorage.getItem(STORAGE_KEY_SEATING); if(stored) try{ const parsed=JSON.parse(stored); if(Array.isArray(parsed)&&parsed.length>0) return parsed; }catch(_){} return DEFAULT_SEATING.map(row=>[...row]); }
        function getScoresData() { const stored=localStorage.getItem(STORAGE_KEY_SCORES); if(stored) try{ const parsed=JSON.parse(stored); if(typeof parsed==='object'&&parsed!==null) return parsed; }catch(_){} return {}; }
        function saveSeatingData(data) { localStorage.setItem(STORAGE_KEY_SEATING,JSON.stringify(data)); }
        function saveScoresData(data) { localStorage.setItem(STORAGE_KEY_SCORES,JSON.stringify(data)); }
        function initScoresForNames(names, existingScores) { const newScores={}; for(const name of names) newScores[name]=(existingScores&&typeof existingScores[name]==='number')?existingScores[name]:0; if(existingScores) for(const [k,v] of Object.entries(existingScores)) if(!(k in newScores)) newScores[k]=v; return newScores; }
        function getDailyQuote() { const today=new Date(); const dayOfYear=Math.floor((today-new Date(today.getFullYear(),0,0))/86400000); return QUOTES[dayOfYear%QUOTES.length]; }
        function getExamCountdown() { const now=new Date(); const exam=new Date(2027,5,7); const diff=Math.ceil((exam-now)/86400000); return diff>0?diff:0; }
        function showDebug(msg,isError=false) { debugToast.textContent=msg; debugToast.style.display='block'; debugToast.style.background=isError?'rgba(200,0,0,0.85)':'rgba(0,0,0,0.8)'; clearTimeout(debugToast._timer); debugToast._timer=setTimeout(()=>{ debugToast.style.display='none'; },3000); }

        function getModeName() {
            switch(activityMode) {
                case 'correction': return '纠错得分';
                case 'comment':    return '讲评得分';
                case 'optimal':    return '优解得分';
                case 'adapt':      return '改编得分';
                default:           return '答题得分';
            }
        }
        function getModeLabel() { return '⏱ ' + getModeName() + '倒计时'; }
        function getModeTitle() { return getModeName(); }
        function getInfoContent() {
            if (activityMode === 'correction') { return '纠错三问：\n1.哪里错了？\n2.为什么错？\n3.怎样做是对的？'; }
            else if (activityMode === 'comment') { return '讲评五要素：\n1.整体思路（逻辑链）\n2.解题过程（必要时板书）\n3.关键步骤\n4.易错点\n5.书写规范性'; }
            return '';
        }
        function needInfoPanel() { return activityMode === 'correction' || activityMode === 'comment'; }

        function initData() { seatingData=getSeatingData(); allNames=getAllNamesFromData(seatingData); const existingScores=getScoresData(); scores=initScoresForNames(allNames,existingScores); const validNames=new Set(allNames); for(const key of Object.keys(scores)) if(!validNames.has(key)) delete scores[key]; saveScoresData(scores); }
        function renderQuoteAndCountdown() { quoteDisplay.textContent=getDailyQuote(); const days=getExamCountdown(); examCountdown.textContent=`距高考还有 ${days} 天`; }

        function getCellElement(row,col) { const cells=seatingGrid.querySelectorAll('.seat-cell'); const idx=row*COLS+col; if(idx<cells.length) return cells[idx]; return null; }
        function getCellFromName(name) { const cells=seatingGrid.querySelectorAll('.seat-cell'); for(const cell of cells) if(cell.dataset.name===name) return cell; return null; }

        // ================================================================
        //  5. 渲染座次表（含分组底色 + 个人分数）
        // ================================================================
        function renderSeating() {
            seatingGrid.innerHTML='';
            for(let r=0;r<seatingData.length;r++){
                const row=seatingData[r];
                for(let c=0;c<row.length;c++){
                    const cell=document.createElement('div');
                    cell.className='seat-cell';
                    const name=row[c]?row[c].trim():'';
                    if(name===''){
                        cell.classList.add('empty');
                        cell.textContent='';
                    }else{
                        // 名字
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'cell-name';
                        nameSpan.textContent = name;
                        cell.appendChild(nameSpan);
                        // 【新增】分数
                        const scoreSpan = document.createElement('span');
                        scoreSpan.className = 'cell-score';
                        const s = scores[name] || 0;
                        scoreSpan.textContent = Number.isInteger(s) ? s : s.toFixed(1);
                        cell.appendChild(scoreSpan);
                        // 【新增】根据全局状态决定是否显示
                        if (showIndividualScores) cell.classList.add('show-score');

                        cell.dataset.name=name;
                        cell.dataset.row=r;
                        cell.dataset.col=c;
                        const group=GROUP_MAP[name];
                        if(group && GROUP_COLORS[group-1]){ cell.style.backgroundColor=GROUP_COLORS[group-1]; }
                        else { cell.style.backgroundColor='rgba(255,255,255,0.80)'; }
                        cell.addEventListener('click',onSeatClick);
                    }
                    seatingGrid.appendChild(cell);
                }
            }
            clearHighlights();
            btnRandom.classList.add('hidden');
            actionBtns.classList.add('hidden');
            multiProgress.textContent='';
            multiLockedCells=[];
            multiCurrentIndex=0;
            isMultiMode=false;
            updateGroupDisplay();
        }

        function clearHighlights() {
            document.querySelectorAll('.seat-cell.highlight').forEach(el=>el.classList.remove('highlight'));
            document.querySelectorAll('.seat-cell.locked').forEach(el=>el.classList.remove('locked'));
            document.querySelectorAll('.seat-cell .order-badge').forEach(el=>el.remove());
        }

        // ================================================================
        //  6. 积分榜（前10名，不换行，字体缩小）
        // ================================================================
        function renderLeaderboard() {
            const validNames=new Set(allNames);
            const entries=[];
            for(const [name,score] of Object.entries(scores)) if(validNames.has(name)&&score>0) entries.push({name,score});
            entries.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
            lbList.innerHTML='';
            if(entries.length===0){ lbList.innerHTML='<div class="lb-empty">暂无积分数据</div>'; return; }
            const top = entries.slice(0, 10);
            for(let i=0;i<top.length;i++){
                const item=document.createElement('div');
                item.className='lb-item';
                if(i===0) item.classList.add('top1');
                if(i===1) item.classList.add('top2');
                if(i===2) item.classList.add('top3');
                const rank=i+1;
                const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':`${rank}.`;
                const s = top[i].score;
                const sText = Number.isInteger(s) ? s : s.toFixed(1);
                item.innerHTML=`<span class="rank">${medal}</span><span class="name">${top[i].name}</span><span class="score">${sText}分</span>`;
                lbList.appendChild(item);
            }
        }

        // ================================================================
        //  7. 小组平均分 → 红旗（最高） / 拳头（最低）
        // ================================================================
        function getTopGroup() {
            const groupScores = {}, groupCounts = {};
            for (let g = 1; g <= 8; g++) { groupScores[g]=0; groupCounts[g]=0; }
            for (const [name, score] of Object.entries(scores)) { const group = GROUP_MAP[name]; if (group) { groupScores[group] += score; groupCounts[group] += 1; } }
            let maxAvg = -Infinity, topGroup = null;
            for (let g = 1; g <= 8; g++) { if (groupCounts[g] > 0) { const avg = groupScores[g] / groupCounts[g]; if (avg > maxAvg) { maxAvg = avg; topGroup = g; } } }
            return topGroup;
        }

        function getBottomGroup() {
            const groupScores = {}, groupCounts = {};
            for (let g = 1; g <= 8; g++) { groupScores[g]=0; groupCounts[g]=0; }
            for (const [name, score] of Object.entries(scores)) { const group = GROUP_MAP[name]; if (group) { groupScores[group] += score; groupCounts[group] += 1; } }
            let minAvg = Infinity, bottomGroup = null;
            for (let g = 1; g <= 8; g++) { if (groupCounts[g] > 0) { const avg = groupScores[g] / groupCounts[g]; if (avg < minAvg) { minAvg = avg; bottomGroup = g; } } }
            return bottomGroup;
        }

        function getGroupCenter(groupNum) {
            const cells = [];
            document.querySelectorAll('.seat-cell:not(.empty)').forEach(cell => { const name = cell.dataset.name; if (GROUP_MAP[name] === groupNum) cells.push(cell); });
            if (cells.length === 0) return null;
            const gridRect = document.getElementById('seatingGrid').getBoundingClientRect();
            let totalX = 0, totalY = 0, count = 0;
            cells.forEach(cell => { const rect = cell.getBoundingClientRect(); totalX += (rect.left + rect.right) / 2; totalY += (rect.top + rect.bottom) / 2; count++; });
            return { x: totalX / count - gridRect.left, y: totalY / count - gridRect.top };
        }

        function updateGroupDisplay() {
            flagContainer.innerHTML = '';
            const topGroup = getTopGroup();
            const bottomGroup = getBottomGroup();
            if (topGroup !== null) { const pos = getGroupCenter(topGroup); if (pos) { const flag = document.createElement('div'); flag.className = 'flag-icon'; flag.textContent = '🚩'; flag.style.left = pos.x + 'px'; flag.style.top = pos.y + 'px'; flagContainer.appendChild(flag); } }
            if (showFist && bottomGroup !== null && bottomGroup !== topGroup) { const pos = getGroupCenter(bottomGroup); if (pos) { const fist = document.createElement('div'); fist.className = 'fist-icon'; fist.textContent = '💪'; fist.style.left = pos.x + 'px'; fist.style.top = pos.y + 'px'; flagContainer.appendChild(fist); } }
        }

        // ================================================================
        //  8. 状态管理
        // ================================================================
        function setState(state,payload) {
            currentState=state;
            countdownWrapper.classList.add('hidden');
            seatingWrapper.classList.add('hidden');
            infoPanel.classList.add('hidden');
            idleState.style.display='none';
            actionBtns.classList.add('hidden');

            switch(state){
                case 'idle':
                    idleState.style.display='block';
                    displayTitle.textContent='📢 选择活动模式';
                    allStartButtons.forEach(b => b.disabled = false);
                    clearHighlights();
                    renderSeating();
                    btnRandom.classList.add('hidden');
                    lockedCell=null;
                    multiLockedCells=[];
                    multiCurrentIndex=0;
                    isMultiMode=false;
                    multiProgress.textContent='';
                    activityMode = 'quiz';
                    break;
                case 'countdown':
                    countdownWrapper.classList.remove('hidden');
                    displayTitle.textContent=getModeLabel();
                    countdownLabel.textContent=getModeLabel();
                    allStartButtons.forEach(b => b.disabled = true);
                    countdownNumber.textContent=payload||10;
                    break;
                case 'info':
                    infoPanel.classList.remove('hidden');
                    displayTitle.textContent=getModeTitle();
                    allStartButtons.forEach(b => b.disabled = true);
                    infoContent.textContent=getInfoContent();
                    break;
                case 'seating':
                    seatingWrapper.classList.remove('hidden');
                    displayTitle.textContent=getModeTitle() + ' - 座次表';
                    allStartButtons.forEach(b => b.disabled = false);
                    renderSeating();
                    btnRandom.classList.remove('hidden');
                    clearHighlights();
                    actionBtns.classList.add('hidden');
                    lockedCell=null;
                    multiLockedCells=[];
                    multiCurrentIndex=0;
                    isMultiMode=false;
                    multiProgress.textContent='';
                    break;
                case 'locked':
                    seatingWrapper.classList.remove('hidden');
                    displayTitle.textContent='🎯 已指定';
                    allStartButtons.forEach(b => b.disabled = true);
                    if(payload&&payload.row!==undefined&&payload.col!==undefined){
                        const cell=getCellElement(payload.row,payload.col);
                        if(cell){ clearHighlights(); cell.classList.add('locked'); }
                        lockedCell=payload;
                    }
                    showActionButtons(lockedCell);
                    break;
                case 'multi_locked':
                    seatingWrapper.classList.remove('hidden');
                    displayTitle.textContent='🎯 多人已指定';
                    allStartButtons.forEach(b => b.disabled = true);
                    if(payload && payload.list) {
                        multiLockedCells = payload.list;
                        multiCurrentIndex = payload.currentIndex || 0;
                        multiProgress.textContent = `已选 ${multiLockedCells.length} 人，当前处理第 ${multiCurrentIndex+1} 人`;
                        if(multiCurrentIndex < multiLockedCells.length) {
                            const current = multiLockedCells[multiCurrentIndex];
                            showActionButtons(current);
                        }
                    }
                    break;
                case 'scored':
                    seatingWrapper.classList.remove('hidden');
                    displayTitle.textContent='✅ 加分完成';
                    allStartButtons.forEach(b => b.disabled = false);
                    document.querySelectorAll('.seat-cell.locked').forEach(el=>el.classList.remove('locked'));
                    document.querySelectorAll('.seat-cell .order-badge').forEach(el=>el.remove());
                    actionBtns.classList.add('hidden');
                    if(isMultiMode && multiCurrentIndex < multiLockedCells.length - 1) {
                        multiCurrentIndex++;
                        multiProgress.textContent = `已选 ${multiLockedCells.length} 人，当前处理第 ${multiCurrentIndex+1} 人`;
                        setTimeout(() => {
                            if(currentState === 'scored' || currentState === 'multi_locked') {
                                const current = multiLockedCells[multiCurrentIndex];
                                const cell = getCellElement(current.row, current.col);
                                if(cell) {
                                    clearHighlights();
                                    cell.classList.add('locked');
                                    multiLockedCells.forEach((item, idx) => {
                                        const c = getCellElement(item.row, item.col);
                                        if(c && !c.querySelector('.order-badge')) {
                                            const badge = document.createElement('span');
                                            badge.className = 'order-badge';
                                            badge.textContent = ORDER_NUMS[idx] || (idx+1);
                                            c.appendChild(badge);
                                        }
                                    });
                                }
                                setState('multi_locked', { list: multiLockedCells, currentIndex: multiCurrentIndex });
                            }
                        }, 800);
                    } else {
                        isMultiMode = false;
                        multiProgress.textContent = '✅ 全部处理完成！';
                        setTimeout(() => {
                            if(currentState === 'scored') { setState('seating'); }
                        }, 1500);
                    }
                    break;
            }
        }

        // ================================================================
        //  9. 倒计时、启动活动
        // ================================================================
        function startCountdown() {
            if(countdownTimer) return;
            let count=10;
            setState('countdown',count);
            playBeep(800,0.12);
            countdownTimer=setInterval(()=>{
                count--;
                if(count<=0){
                    clearInterval(countdownTimer);
                    countdownTimer=null;
                    if (needInfoPanel()) { setState('info'); } else { setState('seating'); }
                    playBeep(1000,0.2);
                    document.getElementById('mainDisplay').scrollIntoView({behavior:'smooth',block:'center'});
                }else{
                    countdownNumber.textContent=count;
                    playBeep(600+count*30,0.08);
                }
            },1000);
        }

        function startActivity(mode) {
            if(currentState==='seating' || currentState==='scored' || currentState==='info') {
                if(randomTimer){ clearTimeout(randomTimer); randomTimer=null; }
                clearHighlights();
                actionBtns.classList.add('hidden');
                btnRandom.disabled=false;
                isProcessing=false;
                lockedCell=null;
                multiLockedCells=[];
                multiCurrentIndex=0;
                isMultiMode=false;
                setState('idle');
                activityMode = mode;
                setTimeout(()=>{ if(currentState==='idle') startCountdown(); }, 300);
                return;
            }
            if(currentState==='idle') {
                activityMode = mode;
                startCountdown();
            }
        }

        // ================================================================
        //  10. 多人随机指定（最多8人）
        // ================================================================
        function startMultiRandomPick(count) {
            countModal.classList.remove('active');
            if(isProcessing || btnRandom.disabled) return;
            const cells = seatingGrid.querySelectorAll('.seat-cell:not(.empty)');
            if(cells.length === 0) return;
            if(count > cells.length) count = cells.length;

            isProcessing = true;
            btnRandom.disabled = true;
            clearHighlights();
            actionBtns.classList.add('hidden');
            isMultiMode = true;
            multiLockedCells = [];
            multiCurrentIndex = 0;

            const positions = [];
            cells.forEach(cell=>{
                const row=parseInt(cell.dataset.row), col=parseInt(cell.dataset.col);
                if(!isNaN(row)&&!isNaN(col)) positions.push({row,col,cell});
            });
            if(positions.length === 0){ isProcessing=false; btnRandom.disabled=false; return; }

            const shuffled = [...positions];
            for(let i=shuffled.length-1; i>0; i--) {
                const j=Math.floor(Math.random()*(i+1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const selected = shuffled.slice(0, count);
            let currentPick = 0;

            function runNextPick() {
                if(currentPick >= selected.length) {
                    isProcessing = false;
                    btnRandom.disabled = false;
                    multiProgress.textContent = `已选 ${multiLockedCells.length} 人，当前处理第 1 人`;
                    setState('multi_locked', { list: multiLockedCells, currentIndex: 0 });
                    return;
                }
                const target = selected[currentPick];
                const totalSteps = 18 + Math.floor(Math.random()*8);
                let step = 0;
                let currentHighlight = null;
                let prevIdx = Math.floor(Math.random() * positions.length);

                function doStep() {
                    if(step >= totalSteps) {
                        if(currentHighlight) currentHighlight.classList.remove('highlight');
                        const name = target.cell.dataset.name;
                        if(name) {
                            const cell = getCellElement(target.row, target.col);
                            if(cell) {
                                cell.classList.add('locked');
                                const badge = document.createElement('span');
                                badge.className = 'order-badge';
                                badge.textContent = ORDER_NUMS[currentPick] || (currentPick+1);
                                cell.appendChild(badge);
                            }
                            multiLockedCells.push({ row: target.row, col: target.col, name, source: 'random' });
                            multiProgress.textContent = `已选中 ${currentPick+1}/${selected.length} 人`;
                            playBeep(1200,0.15);
                            setTimeout(()=>playBeep(1500,0.10),150);
                            currentPick++;
                            setTimeout(runNextPick, 400);
                        } else {
                            currentPick++;
                            runNextPick();
                        }
                        return;
                    }
                    let nextIdx;
                    let attempts=0;
                    do {
                        nextIdx = Math.floor(Math.random() * positions.length);
                        attempts++;
                    } while(nextIdx === prevIdx && attempts < 20 && positions.length > 1);
                    if(currentHighlight) currentHighlight.classList.remove('highlight');
                    const pos = positions[nextIdx];
                    pos.cell.classList.add('highlight');
                    currentHighlight = pos.cell;
                    prevIdx = nextIdx;
                    step++;
                    const progress = step/totalSteps;
                    const delay = 60 + progress * progress * 360;
                    const jitter = (Math.random()-0.5)*20;
                    const finalDelay = Math.max(50, Math.min(450, delay+jitter));
                    if(step % 2 === 0) playBeep(300 + step*6, 0.03);
                    setTimeout(doStep, finalDelay);
                }
                doStep();
            }
            runNextPick();
        }

        // ================================================================
        //  12. 核心操作（加减分）
        // ================================================================
        function handleYes() {
            let cellInfo = lockedCell;
            if(isMultiMode && multiCurrentIndex < multiLockedCells.length) { cellInfo = multiLockedCells[multiCurrentIndex]; }
            if (isProcessing) { showDebug('⏳ 正在处理中，请稍后...',false); return; }
            if (!cellInfo) { showDebug('❌ 未锁定任何同学',true); return; }
            const name = cellInfo.name;
            if (!name) { showDebug('❌ 锁定信息异常',true); return; }
            isProcessing = true;
            actionBtns.classList.add('hidden');
            try {
                addScore(name, 4, cellInfo.row, cellInfo.col, 'plus');
                const neighbors = getNeighbors(cellInfo.row, cellInfo.col);
                for (const n of neighbors) { const nName = seatingData[n.row]?.[n.col]?.trim(); if (nName && nName !== '') addScore(nName, 1, n.row, n.col, 'plus'); }
                renderLeaderboard();
                playBeep(880,0.15); setTimeout(()=>playBeep(1100,0.15),160); setTimeout(()=>playBeep(1320,0.20),320);
                const cell = getCellElement(cellInfo.row, cellInfo.col);
                if(cell) cell.classList.remove('locked');
                showDebug(`✅ ${name} +4分，邻居各+1分`,false);
                setState('scored');
                renderLeaderboard();
                updateGroupDisplay();
            } catch(err) {
                console.error('加分错误:', err);
                showDebug('❌ 加分过程出错，请查看控制台',true);
                setState('seating');
            } finally {
                isProcessing = false;
                btnRandom.disabled = false;
                if(!isMultiMode) { lockedCell = null; }
            }
        }

        function handleNo() {
            let cellInfo = lockedCell;
            if(isMultiMode && multiCurrentIndex < multiLockedCells.length) { cellInfo = multiLockedCells[multiCurrentIndex]; }
            if (isProcessing) { showDebug('⏳ 正在处理中...',false); return; }
            if (!cellInfo) { showDebug('❌ 当前不是随机锁定状态',true); return; }
            const name = cellInfo.name;
            if (!name) return;
            isProcessing = true;
            actionBtns.classList.add('hidden');
            try {
                addScore(name, -2, cellInfo.row, cellInfo.col, 'minus');
                const neighbors = getNeighbors(cellInfo.row, cellInfo.col);
                for (const n of neighbors) { const nName = seatingData[n.row]?.[n.col]?.trim(); if (nName && nName !== '') addScore(nName, -1, n.row, n.col, 'minus'); }
                renderLeaderboard();
                playBeep(300,0.15); setTimeout(()=>playBeep(200,0.15),150);
                const cell = getCellElement(cellInfo.row, cellInfo.col);
                if(cell) cell.classList.remove('locked');
                showDebug(`❌ ${name} -2分，邻居各-1分`,false);
                setState('scored');
                updateGroupDisplay();
            } catch(err) {
                console.error('扣分错误:', err);
                showDebug('❌ 扣分过程出错',true);
                setState('seating');
            } finally {
                isProcessing = false;
                btnRandom.disabled = false;
                if(!isMultiMode) { lockedCell = null; }
            }
        }

        function handleCommentScore(points) {
            let cellInfo = lockedCell;
            if(isMultiMode && multiCurrentIndex < multiLockedCells.length) { cellInfo = multiLockedCells[multiCurrentIndex]; }
            if (isProcessing) { showDebug('⏳ 正在处理中...',false); return; }
            if (!cellInfo) { showDebug('❌ 未锁定任何同学',true); return; }
            const name = cellInfo.name;
            if (!name) return;
            isProcessing = true;
            actionBtns.classList.add('hidden');
            try {
                const neighborPoints = points / 4;
                addScore(name, points, cellInfo.row, cellInfo.col, 'plus');
                const neighbors = getNeighbors(cellInfo.row, cellInfo.col);
                for (const n of neighbors) { const nName = seatingData[n.row]?.[n.col]?.trim(); if (nName && nName !== '') addScore(nName, neighborPoints, n.row, n.col, 'plus'); }
                renderLeaderboard();
                playBeep(880,0.15); setTimeout(()=>playBeep(1100,0.15),160); setTimeout(()=>playBeep(1320,0.20),320);
                const cell = getCellElement(cellInfo.row, cellInfo.col);
                if(cell) cell.classList.remove('locked');
                const nText = Number.isInteger(neighborPoints) ? neighborPoints : neighborPoints.toFixed(1);
                showDebug(`✅ ${name} +${points}分，邻居各+${nText}分`,false);
                setState('scored');
                renderLeaderboard();
                updateGroupDisplay();
            } catch(err) {
                console.error('讲评加分错误:', err);
                showDebug('❌ 加分过程出错',true);
                setState('seating');
            } finally {
                isProcessing = false;
                btnRandom.disabled = false;
                if(!isMultiMode) { lockedCell = null; }
            }
        }

            if (isProcessing) return;
            if (!lockedCell) { showDebug('❌ 当前没有选中状态',true); return; }
            isProcessing = true;
            actionBtns.classList.add('hidden');

        // ================================================================
        //  13. 积分与动画
        // ================================================================
        function addScore(name, points, row, col, type) {
            if (!name) return;
            if (!(name in scores)) scores[name] = 0;
            scores[name] += points;
            saveScoresData(scores);
            let cell = getCellElement(row, col);
            if (!cell) cell = getCellFromName(name);
            if (cell) {
                showScoreFly(cell, points, type);
                // 【新增】同步更新该格子的分数显示
                const scoreSpan = cell.querySelector('.cell-score');
                if (scoreSpan) {
                    const s = scores[name];
                    scoreSpan.textContent = Number.isInteger(s) ? s : s.toFixed(1);
                }
            }
        }

        function showScoreFly(cell, points, type) {
            const rect=cell.getBoundingClientRect(), container=document.getElementById('mainDisplay'), containerRect=container.getBoundingClientRect();
            const fly=document.createElement('div'); fly.className='score-fly';
            const isPlus=points>0, abs=Math.abs(points);
            const absText = Number.isInteger(abs) ? abs : abs.toFixed(1);
            if(isPlus){ fly.classList.add('plus'); if(abs===1) fly.classList.add('plus1'); fly.textContent=`+${absText}`; }
            else{ fly.classList.add('minus'); if(abs===1) fly.classList.add('minus1'); fly.textContent=`-${absText}`; }
            fly.style.left=(rect.left-containerRect.left+rect.width/2-20)+'px';
            fly.style.top=(rect.top-containerRect.top-10)+'px';
            container.appendChild(fly);
            setTimeout(()=>{ if(fly.parentNode) fly.remove(); },1800);
        }

        function getNeighbors(row,col) {
            const result=[], dirs=[[-1,0],[1,0],[0,-1],[0,1]];
            for(const [dr,dc] of dirs){ const nr=row+dr, nc=col+dc; if(nr>=0&&nr<seatingData.length&&nc>=0&&nc<seatingData[nr].length){ const name=seatingData[nr][nc]?.trim(); if(name&&name!=='') result.push({row:nr,col:nc,name}); } }
            return result;
        }

        function onSeatClick(e) {
            const cell=e.currentTarget; if(cell.classList.contains('empty')) return;
            const row=parseInt(cell.dataset.row), col=parseInt(cell.dataset.col), name=cell.dataset.name;
            if(!name) return;
            if(currentState==='seating' || currentState==='scored'){
                if(lockedCell && lockedCell.source==='manual' && lockedCell.row===row && lockedCell.col===col) return;
                selectManual(row,col,name);
            } else if(currentState==='locked' && lockedCell && lockedCell.source==='manual'){
                if(lockedCell.row===row && lockedCell.col===col) return;
                selectManual(row,col,name);
            } else {
                showDebug('当前状态不允许手动选择',false);
            }
        }

        function selectManual(row,col,name){
            if(lockedCell){ const oldCell=getCellElement(lockedCell.row, lockedCell.col); if(oldCell) oldCell.classList.remove('locked'); }
            clearHighlights();
            const cell=getCellElement(row,col);
            if(cell) cell.classList.add('locked');
            setState('locked',{row,col,name,source:'manual'});
        }

        btnImportData.addEventListener('click',function(){ fileInput.click(); });
        fileInput.addEventListener('change',function(e){ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=function(ev){ try{ const data=JSON.parse(ev.target.result); if(data.seating&&Array.isArray(data.seating)&&data.seating.length>0){ if(data.scores&&typeof data.scores==='object'){ seatingData=data.seating; allNames=getAllNamesFromData(seatingData); scores=initScoresForNames(allNames,data.scores); saveSeatingData(seatingData); saveScoresData(scores); renderSeating(); renderLeaderboard(); setState('idle'); playBeep(880,0.15); showDebug('✅ 数据导入成功！',false); }else{ showDebug('❌ 数据格式错误：缺少积分数据',true); } }else{ showDebug('❌ 数据格式错误：座次表数据无效',true); } }catch(err){ showDebug('❌ 文件解析失败：'+err.message,true); } }; reader.readAsText(file); fileInput.value=''; });
        btnModalCancel.addEventListener('click',closeEditModal);
        btnModalSave.addEventListener('click',saveEditModal);
        editModal.addEventListener('click',function(e){ if(e.target===editModal) closeEditModal(); });

        // 加油拳头显示/隐藏开关
        function updateFistToggleUI() {
            if (showFist) { btnToggleFist.classList.remove('off'); btnToggleFist.title = '当前显示加油拳头，点击隐藏'; }
            else { btnToggleFist.classList.add('off'); btnToggleFist.title = '当前隐藏加油拳头，点击显示'; }
        }
        btnToggleFist.addEventListener('click', function() {
            showFist = !showFist;
            localStorage.setItem(STORAGE_KEY_FIST, showFist ? '1' : '0');
            updateFistToggleUI();
            updateGroupDisplay();
            showDebug(showFist ? '💪 已显示加油拳头' : '💪 已隐藏加油拳头', false);
        });
        updateFistToggleUI();

        function openEditModal(){ editGrid.innerHTML=''; for(let r=0;r<seatingData.length;r++){ for(let c=0;c<seatingData[r].length;c++){ const input=document.createElement('input'); const val=seatingData[r][c]||''; input.value=val; input.dataset.row=r; input.dataset.col=c; if(val.trim()===''){ input.classList.add('empty-input'); input.placeholder='空'; } input.addEventListener('dblclick',function(){ this.value=''; this.classList.add('empty-input'); this.placeholder='空'; }); input.addEventListener('input',function(){ if(this.value.trim()!==''){ this.classList.remove('empty-input'); this.placeholder=''; }else{ this.classList.add('empty-input'); this.placeholder='空'; } }); editGrid.appendChild(input); } } editModal.classList.add('active'); const firstInput=editGrid.querySelector('input'); if(firstInput) setTimeout(()=>firstInput.focus(),100); }
        function closeEditModal(){ editModal.classList.remove('active'); }
        function saveEditModal(){ const inputs=editGrid.querySelectorAll('input'); const newData=[]; let row=[]; inputs.forEach((input,idx)=>{ const val=input.value.trim(); row.push(val); if((idx+1)%COLS===0){ newData.push(row); row=[]; } }); if(row.length>0){ while(row.length<COLS) row.push(''); newData.push(row); } const hasData=newData.some(r=>r.some(c=>c.trim()!=='')); if(!hasData){ showDebug('❌ 座次表不能为空，请至少保留一个名字。',true); return; } seatingData=newData; allNames=getAllNamesFromData(seatingData); const newScores={}; for(const name of allNames) newScores[name]=(scores[name]!==undefined)?scores[name]:0; scores=newScores; saveSeatingData(seatingData); saveScoresData(scores); renderSeating(); renderLeaderboard(); setState('idle'); closeEditModal(); playBeep(660,0.12); setTimeout(()=>playBeep(880,0.12),150); showDebug('✅ 座次表已更新',false); }

        document.addEventListener('keydown',function(e){
            if(e.key===' '&&e.target===document.body){ e.preventDefault(); if(currentState==='idle'||currentState==='seating'||currentState==='scored') startActivity('quiz'); }
            if(e.key==='Enter'&&currentState==='seating'&&!btnRandom.disabled&&!btnRandom.classList.contains('hidden')) btnRandom.click();
            if((e.key==='y'||e.key==='Y')&&(currentState==='locked'||currentState==='multi_locked')){
                if (activityMode === 'comment') { const btn4 = actionBtns.querySelector('.btn-score'); if (btn4) btn4.click(); }
                else { const yesBtn=document.querySelector('.action-btn.btn-yes'); if(yesBtn) yesBtn.click(); }
            }
            if((e.key==='n'||e.key==='N')&&(currentState==='locked'||currentState==='multi_locked')){ const noBtn=document.querySelector('.action-btn.btn-no'); if(noBtn) noBtn.click(); }
            if(e.key==='Escape'){ if(editModal.classList.contains('active')) closeEditModal(); if(countModal.classList.contains('active')) countModal.classList.remove('active'); if(currentState==='locked'&&lockedCell){ const cancelBtn=document.querySelector('.action-btn.btn-cancel'); if(cancelBtn) cancelBtn.click(); } }
        });

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if(currentState === 'seating' || currentState === 'scored' || currentState === 'idle') { updateGroupDisplay(); }
            }, 300);
        });

        // ================================================================
        //  17. 初始化
        // ================================================================
        function init(){
            initData(); renderQuoteAndCountdown(); renderSeating(); renderLeaderboard(); setState('idle');
            setInterval(()=>{ renderQuoteAndCountdown(); },3600000);
            const now=new Date(); const nextMidnight=new Date(now); nextMidnight.setHours(24,0,0,0); const msToMidnight=nextMidnight-now;
            setTimeout(()=>{ renderQuoteAndCountdown(); setInterval(()=>renderQuoteAndCountdown(),86400000); },msToMidnight);
            console.log('✅ 课堂积分系统已启动 - 五种模式 + 个人分数显示！');
            console.log('📖 名言:',getDailyQuote()); console.log('⏳ 高考倒计时:',getExamCountdown(),'天');
            console.log('👥 学生总数:',allNames.length);
            showDebug('🚀 系统已启动：五种模式，底栏可显示/隐藏个人分数',false);
        }
        init();
    </script>
</body>
</html>
