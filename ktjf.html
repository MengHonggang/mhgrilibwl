<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课堂抢答积分系统</title>
    <style>
        /* ===== 样式略（与之前相同，保持完整） ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:linear-gradient(145deg,#f0f4ff 0%,#e6edf7 100%); min-height:100vh; padding:16px 24px 20px; user-select:none; overflow-x:hidden; }
        button { cursor:pointer; font-family:inherit; border:none; outline:none; transition:all 0.2s; }
        button:active { transform:scale(0.95); }
        .top-bar { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.70); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:14px 28px; border-radius:20px; box-shadow:0 8px 32px rgba(0,20,50,0.08); margin-bottom:16px; flex-wrap:wrap; gap:12px; }
        .quote-area { font-size:22px; font-weight:600; color:#1a2b4a; display:flex; align-items:center; gap:12px; flex:1; min-width:200px; }
        .quote-icon { font-size:28px; }
        .quote-text { font-style:italic; background:linear-gradient(135deg,#1a2b4a,#2d4a7a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .countdown-area { font-size:26px; font-weight:700; color:#c0392b; background:rgba(192,57,43,0.10); padding:6px 24px; border-radius:40px; white-space:nowrap; border:2px solid rgba(192,57,43,0.20); letter-spacing:1px; display:flex; align-items:center; gap:8px; }
        .countdown-area .cd-icon { font-size:28px; }
        .btn-start-wrapper { display:flex; justify-content:center; margin-bottom:14px; }
        .btn-start { font-size:30px; font-weight:700; padding:14px 60px; border-radius:60px; background:linear-gradient(135deg,#4a7ec9,#2d5aa0); color:#fff; box-shadow:0 8px 28px rgba(45,90,160,0.35); letter-spacing:4px; transition:all 0.3s; min-width:200px; }
        .btn-start:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(45,90,160,0.45); }
        .btn-start:disabled { background:#a0b8d0; box-shadow:none; transform:none; cursor:not-allowed; }
        .btn-start.reset-mode { background:linear-gradient(135deg,#e67e22,#d35400); box-shadow:0 8px 28px rgba(211,84,0,0.35); }
        .btn-start.reset-mode:hover { box-shadow:0 12px 36px rgba(211,84,0,0.45); }
        .main-area { display:flex; gap:20px; min-height:520px; }
        .main-display { position:relative; flex:1; background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:24px; box-shadow:0 8px 40px rgba(0,20,50,0.10); padding:24px 28px 20px; min-height:480px; display:flex; flex-direction:column; transition:all 0.3s; border:2px solid rgba(255,255,255,0.40); }
        .display-title { font-size:20px; font-weight:600; color:#2c3e50; text-align:center; margin-bottom:10px; letter-spacing:2px; }
        .display-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
        .countdown-big { font-size:120px; font-weight:900; color:#2d5aa0; text-shadow:0 4px 20px rgba(45,90,160,0.20); line-height:1; animation:pulse 1s ease-in-out infinite; }
        .countdown-big .label { font-size:40px; font-weight:600; color:#4a7ec9; display:block; margin-bottom:10px; animation:none; }
        @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
        .seating-wrapper { width:100%; position:relative; padding:4px 0; }
        .seating-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; width:100%; position:relative; }
        .seat-cell { background:rgba(255,255,255,0.80); border-radius:12px; padding:12px 4px; text-align:center; font-size:20px; font-weight:600; color:#1a2b4a; box-shadow:0 2px 8px rgba(0,0,0,0.04); border:3px solid transparent; transition:all 0.15s; position:relative; min-height:52px; display:flex; align-items:center; justify-content:center; word-break:keep-all; cursor:pointer; }
        .seat-cell.empty { background:transparent; box-shadow:none; border-color:transparent; color:transparent; pointer-events:none; cursor:default; }
        .seat-cell.highlight { border-color:#e74c3c; box-shadow:0 0 0 4px rgba(231,76,60,0.30),0 0 20px rgba(231,76,60,0.25); transform:scale(1.02); z-index:5; transition:all 0.10s ease; }
        .seat-cell.locked { border-color:#f39c12; box-shadow:0 0 0 4px rgba(243,156,18,0.40),0 0 30px rgba(243,156,18,0.30); transform:scale(1.04); z-index:6; background:rgba(255,243,200,0.80); }
        .action-btns-wrapper { position:absolute; display:flex; align-items:center; gap:14px; z-index:20; pointer-events:none; transition:opacity 0.25s; }
        .action-btns-wrapper.hidden { opacity:0; pointer-events:none; }
        .action-btn { width:56px; height:56px; border-radius:50%; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(0,0,0,0.18); pointer-events:auto; border:3px solid rgba(255,255,255,0.6); transition:all 0.15s; color:#fff; line-height:1; }
        .action-btn:hover { transform:scale(1.10); }
        .action-btn.btn-yes { background:linear-gradient(135deg,#27ae60,#2ecc71); }
        .action-btn.btn-no { background:linear-gradient(135deg,#e74c3c,#c0392b); }
        .action-btn.btn-cancel { background:#95a5a6; color:#fff; }
        .score-fly { position:absolute; font-size:36px; font-weight:900; z-index:30; pointer-events:none; animation:flyUp 1.6s ease-out forwards; text-shadow:0 2px 12px rgba(0,0,0,0.15); }
        .score-fly.plus { color:#27ae60; text-shadow:0 2px 12px rgba(39,174,96,0.35); }
        .score-fly.minus { color:#e74c3c; text-shadow:0 2px 12px rgba(231,76,60,0.35); }
        .score-fly.plus1, .score-fly.minus1 { font-size:28px; }
        @keyframes flyUp { 0% { opacity:1; transform:translateY(0) scale(0.8); } 30% { opacity:1; transform:translateY(-20px) scale(1.2); } 100% { opacity:0; transform:translateY(-90px) scale(1); } }
        .btn-random { font-size:22px; font-weight:700; padding:12px 36px; border-radius:40px; background:linear-gradient(135deg,#e67e22,#f39c12); color:#fff; box-shadow:0 6px 24px rgba(243,156,18,0.35); margin-top:18px; align-self:flex-end; transition:all 0.25s; letter-spacing:2px; }
        .btn-random:hover { transform:translateY(-2px) scale(1.02); box-shadow:0 10px 32px rgba(243,156,18,0.45); }
        .btn-random:disabled { background:#b0b8c8; box-shadow:none; transform:none; cursor:not-allowed; }
        .btn-random.hidden { display:none; }
        .leaderboard { width:220px; min-width:180px; background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:24px; box-shadow:0 8px 40px rgba(0,20,50,0.10); padding:20px 18px 18px; border:2px solid rgba(255,255,255,0.40); display:flex; flex-direction:column; max-height:580px; overflow-y:auto; }
        .leaderboard h3 { font-size:22px; font-weight:700; color:#1a2b4a; text-align:center; margin-bottom:16px; letter-spacing:2px; border-bottom:3px solid rgba(45,90,160,0.15); padding-bottom:12px; }
        .lb-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; margin-bottom:4px; border-radius:12px; font-size:18px; font-weight:500; color:#1a2b4a; transition:background 0.2s; background:rgba(255,255,255,0.30); }
        .lb-item .rank { font-weight:700; color:#7f8c8d; margin-right:10px; min-width:28px; }
        .lb-item .name { flex:1; }
        .lb-item .score { font-weight:700; color:#2d5aa0; background:rgba(45,90,160,0.08); padding:0 12px; border-radius:20px; font-size:17px; }
        .lb-item.top1 { background:rgba(255,215,0,0.20); }
        .lb-item.top1 .rank { color:#f39c12; }
        .lb-item.top2 { background:rgba(192,192,192,0.15); }
        .lb-item.top2 .rank { color:#95a5a6; }
        .lb-item.top3 { background:rgba(205,127,50,0.12); }
        .lb-item.top3 .rank { color:#d35400; }
        .lb-empty { text-align:center; color:#95a5a6; font-size:16px; padding:30px 0; }
        .footer-toolbar { margin-top:16px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
        .footer-toolbar button { font-size:16px; font-weight:600; padding:10px 26px; border-radius:30px; background:rgba(255,255,255,0.70); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#1a2b4a; box-shadow:0 4px 16px rgba(0,0,0,0.04); border:2px solid rgba(255,255,255,0.50); transition:all 0.2s; }
        .footer-toolbar button:hover { background:rgba(255,255,255,0.90); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,20,50,0.10); }
        .footer-toolbar button.danger { color:#c0392b; border-color:rgba(192,57,43,0.25); }
        .footer-toolbar button.danger:hover { background:rgba(192,57,43,0.08); border-color:rgba(192,57,43,0.40); }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:999; padding:20px; }
        .modal-overlay.active { display:flex; }
        .modal-box { background:#fff; border-radius:28px; padding:30px 34px 34px; max-width:820px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,0.30); animation:modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity:0; transform:scale(0.94) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-box h2 { font-size:26px; color:#1a2b4a; margin-bottom:18px; text-align:center; letter-spacing:2px; }
        .modal-box .hint { font-size:15px; color:#7f8c8d; text-align:center; margin-bottom:16px; }
        .modal-edit-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:20px; }
        .modal-edit-grid input { width:100%; padding:8px 4px; border:2px solid #dce3ed; border-radius:8px; font-size:16px; text-align:center; font-weight:500; color:#1a2b4a; background:#f8faff; transition:border 0.2s; font-family:inherit; }
        .modal-edit-grid input:focus { border-color:#4a7ec9; outline:none; background:#fff; }
        .modal-edit-grid input.empty-input { background:#f0f2f5; color:#b0b8c8; }
        .modal-actions { display:flex; justify-content:flex-end; gap:14px; margin-top:6px; }
        .modal-actions button { font-size:18px; font-weight:600; padding:10px 34px; border-radius:40px; transition:all 0.2s; }
        .modal-actions .btn-save { background:linear-gradient(135deg,#27ae60,#2ecc71); color:#fff; box-shadow:0 4px 16px rgba(39,174,96,0.30); }
        .modal-actions .btn-save:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(39,174,96,0.40); }
        .modal-actions .btn-cancel { background:#ecf0f1; color:#2c3e50; }
        .modal-actions .btn-cancel:hover { background:#dde1e3; }
        @media (max-width:900px) { .main-area { flex-direction:column; } .leaderboard { width:100%; max-height:260px; min-width:unset; flex-direction:row; flex-wrap:wrap; padding:14px 18px; } .leaderboard h3 { width:100%; margin-bottom:8px; padding-bottom:8px; font-size:18px; } .lb-item { flex:0 0 calc(50% - 6px); font-size:16px; padding:6px 10px; } .top-bar { flex-direction:column; align-items:stretch; text-align:center; padding:12px 16px; } .quote-area { font-size:18px; justify-content:center; } .countdown-area { font-size:20px; justify-content:center; padding:4px 16px; } .btn-start { font-size:24px; padding:12px 36px; min-width:150px; } .seat-cell { font-size:16px; padding:8px 2px; min-height:40px; } .seating-grid { gap:5px; } .countdown-big { font-size:80px; } .countdown-big .label { font-size:28px; } .action-btn { width:44px; height:44px; font-size:24px; } .modal-box { padding:20px 16px; } .modal-edit-grid { gap:4px; } .modal-edit-grid input { font-size:14px; padding:6px 2px; } }
        @media (max-width:500px) { .seat-cell { font-size:12px; padding:4px 1px; min-height:30px; border-radius:6px; } .seating-grid { gap:3px; } .countdown-big { font-size:56px; } .countdown-big .label { font-size:20px; } .btn-start { font-size:18px; padding:10px 24px; min-width:120px; } .action-btn { width:36px; height:36px; font-size:18px; } .leaderboard .lb-item { font-size:14px; flex:0 0 100%; } .modal-edit-grid { grid-template-columns:repeat(4,1fr); } .top-bar .quote-area { font-size:15px; } .countdown-area { font-size:16px; } }
        .leaderboard::-webkit-scrollbar { width:4px; }
        .leaderboard::-webkit-scrollbar-track { background:rgba(0,0,0,0.04); border-radius:4px; }
        .leaderboard::-webkit-scrollbar-thumb { background:rgba(45,90,160,0.25); border-radius:4px; }
        .modal-box::-webkit-scrollbar { width:4px; }
        .modal-box::-webkit-scrollbar-track { background:rgba(0,0,0,0.04); border-radius:4px; }
        .modal-box::-webkit-scrollbar-thumb { background:rgba(45,90,160,0.20); border-radius:4px; }
        .status-hint { font-size:22px; color:#7f8c8d; font-weight:500; letter-spacing:2px; text-align:center; }
        .status-hint .emoji { font-size:48px; display:block; margin-bottom:8px; }
        .seating-wrapper.hidden { display:none; }
        .countdown-big-wrapper { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; min-height:300px; }
        .countdown-big-wrapper.hidden { display:none; }
        .debug-toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 24px; border-radius:30px; font-size:16px; z-index:9999; display:none; pointer-events:none; }
    </style>
</head>
<body>

    <!-- ===== 顶部栏、按钮、主区域、模态框等 DOM 结构（与之前相同） ===== -->
    <header class="top-bar">
        <div class="quote-area">
            <span class="quote-icon">📖</span>
            <span class="quote-text" id="quoteDisplay">今日名言加载中…</span>
        </div>
        <div class="countdown-area">
            <span class="cd-icon">⏳</span>
            <span id="examCountdown">距高考还有 --- 天</span>
        </div>
    </header>
    <div class="btn-start-wrapper">
        <button class="btn-start" id="btnStart">🚀 开始抢答</button>
    </div>
    <div class="main-area">
        <div class="main-display" id="mainDisplay">
            <div class="display-title" id="displayTitle">📢 抢答区</div>
            <div class="display-content" id="displayContent">
                <div class="countdown-big-wrapper" id="countdownWrapper">
                    <div class="countdown-big">
                        <span class="label">⏱ 抢答倒计时</span>
                        <span id="countdownNumber">10</span>
                    </div>
                </div>
                <div class="seating-wrapper hidden" id="seatingWrapper">
                    <div class="seating-grid" id="seatingGrid"></div>
                    <button class="btn-random" id="btnRandom">🎲 随机指定</button>
                </div>
                <div id="idleState" class="status-hint">
                    <span class="emoji">🙌</span>
                    点击「开始抢答」发起挑战
                </div>
            </div>
            <div class="action-btns-wrapper hidden" id="actionBtns"></div>
        </div>
        <div class="leaderboard" id="leaderboard">
            <h3>🏆 积分榜</h3>
            <div id="lbList"><div class="lb-empty">暂无积分数据</div></div>
        </div>
    </div>
    <div class="footer-toolbar">
        <button id="btnEditSeating">📝 编辑座次表</button>
        <button id="btnResetScores" class="danger">🔄 重置积分</button>
        <button id="btnExportData">💾 导出数据</button>
        <button id="btnImportData">📂 导入数据</button>
    </div>
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2>📝 编辑座次表</h2>
            <p class="hint">双击单元格可编辑，空单元格留空即可。修改后点击「保存」。</p>
            <div class="modal-edit-grid" id="editGrid"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnModalCancel">取消</button>
                <button class="btn-save" id="btnModalSave">✅ 保存</button>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none" />
    <div class="debug-toast" id="debugToast"></div>

    <script>
        // ================================================================
        //  1. 数据与状态（与之前一致，略）
        // ================================================================
        const DEFAULT_SEATING = [
            ['常婧雯','杨雨欣','董欣娜','赵恩彤','韩雨卓','田佳悦','占雪莉','王艺萌'],
            ['李语琪','岳梦瑶','郝雅露','赵嘉怡','洪久程','王晨旭','周雅雯','张博文'],
            ['刘鑫雅','张洪宇','李雪铷','曹钰','江瑞阳','王星奥','耿洪顺','张祺毓'],
            ['马婧媛','张沛萱','刘子豪','陈浩楠','李施禹','王旭','胡心琳','赵家伊'],
            ['缪馨雅','张鹏飞','孟雨涵','褚雨恒','李衍呈','谢育航','李嘉雪','支童欣'],
            ['桑子萱','张笑笑','王馨逸','段峻熙','梁书楷','张恒豪','李思梦','王司奕'],
            ['王若淇','张英潭','吴雨炫','郭雅馨','马欣悦','赵恪材','梁若琳','周志辉'],
            ['吴玮琦','陈志远','岳彩博','韩梦洁','滕陈钦毅','','','']
        ];
        const QUOTES = ['书山有路勤为径，学海无涯苦作舟。','宝剑锋从磨砺出，梅花香自苦寒来。','天道酬勤，厚积薄发。','青春须早为，岂能长少年。','志当存高远，路自脚下行。','不积跬步，无以至千里。','学如逆水行舟，不进则退。','少年易学老难成，一寸光阴不可轻。','长风破浪会有时，直挂云帆济沧海。','千淘万漉虽辛苦，吹尽狂沙始到金。','博学之，审问之，慎思之，明辨之，笃行之。','业精于勤，荒于嬉；行成于思，毁于随。','古之立大事者，不惟有超世之才，亦必有坚忍不拔之志。','天行健，君子以自强不息。','有志者，事竟成。','锲而不舍，金石可镂。','敏而好学，不耻下问。','学而不思则罔，思而不学则殆。','温故而知新，可以为师矣。','三人行，必有我师焉。','发奋识遍天下字，立志读尽人间书。','黑发不知勤学早，白首方悔读书迟。','少壮不努力，老大徒伤悲。','读书破万卷，下笔如有神。','会当凌绝顶，一览众山小。'];
        const STORAGE_KEY_SEATING = 'classroom_seating';
        const STORAGE_KEY_SCORES = 'classroom_scores';

        let seatingData = [], scores = {}, allNames = [];
        let currentState = 'idle', countdownTimer = null, randomTimer = null;
        let lockedCell = null; // { row, col, name, source }
        let isProcessing = false;

        const $ = id => document.getElementById(id);
        const quoteDisplay = $('quoteDisplay'), examCountdown = $('examCountdown');
        const btnStart = $('btnStart'), displayTitle = $('displayTitle'), displayContent = $('displayContent');
        const countdownWrapper = $('countdownWrapper'), countdownNumber = $('countdownNumber');
        const seatingWrapper = $('seatingWrapper'), seatingGrid = $('seatingGrid'), btnRandom = $('btnRandom');
        const idleState = $('idleState'), actionBtns = $('actionBtns'), lbList = $('lbList');
        const editModal = $('editModal'), editGrid = $('editGrid'), btnModalCancel = $('btnModalCancel'), btnModalSave = $('btnModalSave');
        const btnEditSeating = $('btnEditSeating'), btnResetScores = $('btnResetScores');
        const btnExportData = $('btnExportData'), btnImportData = $('btnImportData'), fileInput = $('fileInput');
        const debugToast = $('debugToast');

        // ================================================================
        //  2. 工具函数（略，与之前相同）
        // ================================================================
        function getAllNamesFromData(data) { const names=[]; for(const row of data) for(const cell of row) if(cell && cell.trim()!=='') names.push(cell.trim()); return names; }
        function getSeatingData() { const stored=localStorage.getItem(STORAGE_KEY_SEATING); if(stored) try{ const parsed=JSON.parse(stored); if(Array.isArray(parsed)&&parsed.length>0) return parsed; }catch(_){} return DEFAULT_SEATING.map(row=>[...row]); }
        function getScoresData() { const stored=localStorage.getItem(STORAGE_KEY_SCORES); if(stored) try{ const parsed=JSON.parse(stored); if(typeof parsed==='object'&&parsed!==null) return parsed; }catch(_){} return {}; }
        function saveSeatingData(data) { localStorage.setItem(STORAGE_KEY_SEATING,JSON.stringify(data)); }
        function saveScoresData(data) { localStorage.setItem(STORAGE_KEY_SCORES,JSON.stringify(data)); }
        function initScoresForNames(names, existingScores) { const newScores={}; for(const name of names) newScores[name]=(existingScores&&typeof existingScores[name]==='number')?existingScores[name]:0; if(existingScores) for(const [k,v] of Object.entries(existingScores)) if(!(k in newScores)) newScores[k]=v; return newScores; }
        function getDailyQuote() { const today=new Date(); const dayOfYear=Math.floor((today-new Date(today.getFullYear(),0,0))/86400000); return QUOTES[dayOfYear%QUOTES.length]; }
        function getExamCountdown() { const now=new Date(); const exam=new Date(2027,5,7); const diff=Math.ceil((exam-now)/86400000); return diff>0?diff:0; }
        function showDebug(msg,isError=false) { debugToast.textContent=msg; debugToast.style.display='block'; debugToast.style.background=isError?'rgba(200,0,0,0.85)':'rgba(0,0,0,0.8)'; clearTimeout(debugToast._timer); debugToast._timer=setTimeout(()=>{ debugToast.style.display='none'; },3000); }

        // ================================================================
        //  3. 初始化与渲染（略）
        // ================================================================
        function initData() { seatingData=getSeatingData(); allNames=getAllNamesFromData(seatingData); const existingScores=getScoresData(); scores=initScoresForNames(allNames,existingScores); const validNames=new Set(allNames); for(const key of Object.keys(scores)) if(!validNames.has(key)) delete scores[key]; saveScoresData(scores); }
        function renderQuoteAndCountdown() { quoteDisplay.textContent=getDailyQuote(); const days=getExamCountdown(); examCountdown.textContent=`距高考还有 ${days} 天`; }
        function renderSeating() { seatingGrid.innerHTML=''; for(let r=0;r<seatingData.length;r++){ const row=seatingData[r]; for(let c=0;c<row.length;c++){ const cell=document.createElement('div'); cell.className='seat-cell'; const name=row[c]?row[c].trim():''; if(name===''){ cell.classList.add('empty'); cell.textContent=''; }else{ cell.textContent=name; cell.dataset.name=name; cell.dataset.row=r; cell.dataset.col=c; cell.addEventListener('click',onSeatClick); } seatingGrid.appendChild(cell); } } clearHighlights(); btnRandom.classList.add('hidden'); actionBtns.classList.add('hidden'); }
        function clearHighlights() { document.querySelectorAll('.seat-cell.highlight').forEach(el=>el.classList.remove('highlight')); document.querySelectorAll('.seat-cell.locked').forEach(el=>el.classList.remove('locked')); }
        function getCellElement(row,col) { const cells=seatingGrid.querySelectorAll('.seat-cell'); const idx=row*8+col; if(idx<cells.length) return cells[idx]; return null; }
        function renderLeaderboard() { const validNames=new Set(allNames); const entries=[]; for(const [name,score] of Object.entries(scores)) if(validNames.has(name)&&score>0) entries.push({name,score}); entries.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)); lbList.innerHTML=''; if(entries.length===0){ lbList.innerHTML='<div class="lb-empty">暂无积分数据</div>'; return; } const top=entries.slice(0,5); for(let i=0;i<top.length;i++){ const item=document.createElement('div'); item.className='lb-item'; if(i===0) item.classList.add('top1'); if(i===1) item.classList.add('top2'); if(i===2) item.classList.add('top3'); const rank=i+1; const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':`${rank}.`; item.innerHTML=`<span class="rank">${medal}</span><span class="name">${top[i].name}</span><span class="score">${top[i].score}分</span>`; lbList.appendChild(item); } }

        function setState(state,payload) { currentState=state; countdownWrapper.classList.add('hidden'); seatingWrapper.classList.add('hidden'); idleState.style.display='none'; actionBtns.classList.add('hidden'); switch(state){ case 'idle': idleState.style.display='block'; displayTitle.textContent='📢 抢答区'; btnStart.textContent='🚀 开始抢答'; btnStart.disabled=false; btnStart.classList.remove('reset-mode'); clearHighlights(); renderSeating(); btnRandom.classList.add('hidden'); lockedCell=null; break; case 'countdown': countdownWrapper.classList.remove('hidden'); displayTitle.textContent='⏱ 倒计时'; btnStart.disabled=true; countdownNumber.textContent=payload||10; break; case 'seating': seatingWrapper.classList.remove('hidden'); displayTitle.textContent='🧑‍🎓 座次表'; btnStart.textContent='🔄 重新开始'; btnStart.disabled=false; btnStart.classList.add('reset-mode'); renderSeating(); btnRandom.classList.remove('hidden'); clearHighlights(); actionBtns.classList.add('hidden'); lockedCell=null; break; case 'locked': seatingWrapper.classList.remove('hidden'); displayTitle.textContent='🎯 已指定'; btnStart.disabled=true; if(payload&&payload.row!==undefined&&payload.col!==undefined){ const cell=getCellElement(payload.row,payload.col); if(cell){ clearHighlights(); cell.classList.add('locked'); } lockedCell=payload; } showActionButtons(lockedCell); break; case 'scored': seatingWrapper.classList.remove('hidden'); displayTitle.textContent='✅ 加分完成'; btnStart.disabled=false; btnStart.textContent='🔄 重新开始'; btnStart.classList.add('reset-mode'); document.querySelectorAll('.seat-cell.locked').forEach(el=>el.classList.remove('locked')); actionBtns.classList.add('hidden'); lockedCell=null; break; } }

        // ================================================================
        //  4. 倒计时、随机指定（略）
        // ================================================================
        function startCountdown() { if(countdownTimer) return; let count=10; setState('countdown',count); playBeep(800,0.12); countdownTimer=setInterval(()=>{ count--; if(count<=0){ clearInterval(countdownTimer); countdownTimer=null; setState('seating'); playBeep(1000,0.2); document.getElementById('mainDisplay').scrollIntoView({behavior:'smooth',block:'center'}); }else{ countdownNumber.textContent=count; playBeep(600+count*30,0.08); } },1000); }
        function startRandomPick() { if(isProcessing||btnRandom.disabled) return; const cells=seatingGrid.querySelectorAll('.seat-cell:not(.empty)'); if(cells.length===0) return; isProcessing=true; btnRandom.disabled=true; clearHighlights(); actionBtns.classList.add('hidden'); const positions=[]; cells.forEach(cell=>{ const row=parseInt(cell.dataset.row), col=parseInt(cell.dataset.col); if(!isNaN(row)&&!isNaN(col)) positions.push({row,col,cell}); }); if(positions.length===0){ isProcessing=false; btnRandom.disabled=false; return; } const totalSteps=20+Math.floor(Math.random()*8); let step=0, currentHighlight=null, prevIdx=Math.floor(Math.random()*positions.length); function doStep(){ if(step>=totalSteps){ const finalPos=positions[prevIdx]; if(currentHighlight) currentHighlight.classList.remove('highlight'); const name=finalPos.cell.dataset.name; if(name){ setState('locked',{row:finalPos.row,col:finalPos.col,name,source:'random'}); playBeep(1200,0.15); setTimeout(()=>playBeep(1500,0.10),150); }else{ setState('seating'); } isProcessing=false; btnRandom.disabled=false; return; } let nextIdx, attempts=0; do{ nextIdx=Math.floor(Math.random()*positions.length); attempts++; }while(nextIdx===prevIdx&&attempts<20&&positions.length>1); if(currentHighlight) currentHighlight.classList.remove('highlight'); const pos=positions[nextIdx]; pos.cell.classList.add('highlight'); currentHighlight=pos.cell; prevIdx=nextIdx; step++; const progress=step/totalSteps; const delay=60+progress*progress*360; const jitter=(Math.random()-0.5)*20; const finalDelay=Math.max(50,Math.min(450,delay+jitter)); if(step%2===0) playBeep(300+step*6,0.03); setTimeout(doStep,finalDelay); } doStep(); }

        // ================================================================
        //  5. 动作按钮显示
        // ================================================================
        function showActionButtons(payload) {
            if(!payload||payload.row===undefined||payload.col===undefined){ actionBtns.classList.add('hidden'); return; }
            const cell=getCellElement(payload.row,payload.col);
            if(!cell){ actionBtns.classList.add('hidden'); return; }
            actionBtns.innerHTML='';
            const btnYes=document.createElement('button'); btnYes.className='action-btn btn-yes'; btnYes.textContent='✓';
            const isRandom=payload.source==='random';
            const btnRight=document.createElement('button');
            if(isRandom){ btnRight.className='action-btn btn-no'; btnRight.textContent='✗'; btnRight.title='扣分 (自己和邻居-1)'; }
            else{ btnRight.className='action-btn btn-cancel'; btnRight.textContent='✕'; btnRight.title='取消选中'; }
            actionBtns.appendChild(btnYes); actionBtns.appendChild(btnRight);
            const mainRect=document.getElementById('mainDisplay').getBoundingClientRect();
            const cellRect=cell.getBoundingClientRect();
            const btnSize=56, gap=16;
            actionBtns.style.position='absolute';
            actionBtns.style.left=(cellRect.left-mainRect.left)+'px';
            actionBtns.style.top=(cellRect.top-mainRect.top)+'px';
            actionBtns.style.width=cellRect.width+'px';
            actionBtns.style.height=cellRect.height+'px';
            actionBtns.style.pointerEvents='none';
            actionBtns.style.background='transparent';
            actionBtns.style.border='none';
            actionBtns.style.boxShadow='none';
            actionBtns.style.padding='0';
            actionBtns.style.margin='0';
            actionBtns.style.overflow='visible';
            actionBtns.style.display='block';
            actionBtns.style.zIndex='20';

            btnYes.style.position='absolute'; btnYes.style.left=-(btnSize+gap)+'px'; btnYes.style.top='50%'; btnYes.style.transform='translateY(-50%)';
            btnYes.style.width=btnSize+'px'; btnYes.style.height=btnSize+'px'; btnYes.style.borderRadius='50%'; btnYes.style.fontSize='32px';
            btnYes.style.display='flex'; btnYes.style.alignItems='center'; btnYes.style.justifyContent='center'; btnYes.style.pointerEvents='auto';
            btnYes.style.border='3px solid rgba(255,255,255,0.6)'; btnYes.style.boxShadow='0 6px 24px rgba(0,0,0,0.18)';
            btnYes.style.color='#fff'; btnYes.style.background='linear-gradient(135deg,#27ae60,#2ecc71)';

            btnRight.style.position='absolute'; btnRight.style.right=-(btnSize+gap)+'px'; btnRight.style.top='50%'; btnRight.style.transform='translateY(-50%)';
            btnRight.style.width=btnSize+'px'; btnRight.style.height=btnSize+'px'; btnRight.style.borderRadius='50%'; btnRight.style.fontSize='32px';
            btnRight.style.display='flex'; btnRight.style.alignItems='center'; btnRight.style.justifyContent='center'; btnRight.style.pointerEvents='auto';
            btnRight.style.border='3px solid rgba(255,255,255,0.6)'; btnRight.style.boxShadow='0 6px 24px rgba(0,0,0,0.18)';
            btnRight.style.color='#fff'; btnRight.style.background=isRandom?'linear-gradient(135deg,#e74c3c,#c0392b)':'#95a5a6';

            btnYes.addEventListener('click',function(e){ e.stopPropagation(); handleYes(); });
            if(isRandom) btnRight.addEventListener('click',function(e){ e.stopPropagation(); handleNo(); });
            else btnRight.addEventListener('click',function(e){ e.stopPropagation(); handleCancel(); });
            actionBtns.classList.remove('hidden');
        }

        // ================================================================
        //  6. 核心处理函数（修复：使用局部变量保存 lockedCell）
        // ================================================================

        // ----- 对钩 (加分) -----
        function handleYes() {
            // 立即拷贝当前锁定对象，防止被中途置空
            const cellInfo = lockedCell;
            if (isProcessing) {
                showDebug('⏳ 正在处理中，请稍后...', false);
                return;
            }
            if (!cellInfo) {
                showDebug('❌ 未锁定任何同学', true);
                return;
            }
            const name = cellInfo.name;
            if (!name) {
                showDebug('❌ 锁定信息异常', true);
                return;
            }

            isProcessing = true;
            actionBtns.classList.add('hidden');

            try {
                // 主 +4
                addScore(name, 4, cellInfo.row, cellInfo.col, 'plus');
                // 邻居 +1
                const neighbors = getNeighbors(cellInfo.row, cellInfo.col);
                for (const n of neighbors) {
                    const nName = seatingData[n.row]?.[n.col]?.trim();
                    if (nName && nName !== '') {
                        addScore(nName, 1, n.row, n.col, 'plus');
                    }
                }
                renderLeaderboard();
                playBeep(880, 0.15);
                setTimeout(() => playBeep(1100, 0.15), 160);
                setTimeout(() => playBeep(1320, 0.20), 320);

                setState('scored');
                // 保留高亮
                const cell = getCellElement(cellInfo.row, cellInfo.col);
                if (cell) cell.classList.add('highlight');
                renderLeaderboard();
                showDebug(`✅ ${name} +4分，邻居各+1分`, false);
            } catch (err) {
                console.error('加分错误:', err);
                showDebug('❌ 加分过程出错，请查看控制台', true);
                setState('seating');
            } finally {
                isProcessing = false;
                lockedCell = null;
                btnRandom.disabled = false;
            }
        }

        // ----- 红叉 (扣分) -----
        function handleNo() {
            const cellInfo = lockedCell;
            if (isProcessing) {
                showDebug('⏳ 正在处理中...', false);
                return;
            }
            if (!cellInfo || cellInfo.source !== 'random') {
                showDebug('❌ 当前不是随机锁定状态', true);
                return;
            }
            const name = cellInfo.name;
            if (!name) return;

            isProcessing = true;
            actionBtns.classList.add('hidden');

            try {
                addScore(name, -1, cellInfo.row, cellInfo.col, 'minus');
                const neighbors = getNeighbors(cellInfo.row, cellInfo.col);
                for (const n of neighbors) {
                    const nName = seatingData[n.row]?.[n.col]?.trim();
                    if (nName && nName !== '') {
                        addScore(nName, -1, n.row, n.col, 'minus');
                    }
                }
                renderLeaderboard();
                playBeep(300, 0.15);
                setTimeout(() => playBeep(200, 0.15), 150);

                setState('seating');
                const cell = getCellElement(cellInfo.row, cellInfo.col);
                if (cell) {
                    cell.classList.add('highlight');
                    setTimeout(() => cell.classList.remove('highlight'), 800);
                }
                showDebug(`❌ ${name} 及邻居各-1分`, false);
            } catch (err) {
                console.error('扣分错误:', err);
                showDebug('❌ 扣分过程出错', true);
                setState('seating');
            } finally {
                isProcessing = false;
                lockedCell = null;
                btnRandom.disabled = false;
            }
        }

        // ----- 取消 (仅手动) -----
        function handleCancel() {
            const cellInfo = lockedCell;
            if (isProcessing) return;
            if (!cellInfo || cellInfo.source !== 'manual') {
                showDebug('❌ 当前不是手动选中状态', true);
                return;
            }
            isProcessing = true;
            actionBtns.classList.add('hidden');

            setState('seating');
            clearHighlights();
            lockedCell = null;
            isProcessing = false;
            btnRandom.disabled = false;
            showDebug('✕ 已取消选中', false);
        }

        // ================================================================
        //  7. 积分与动画、邻居获取（略）
        // ================================================================
        function addScore(name, points, row, col, type) {
            if (!name) return;
            if (!(name in scores)) scores[name] = 0;
            scores[name] += points;
            saveScoresData(scores);
            let cell = getCellElement(row, col);
            if (!cell) cell = getCellFromName(name);
            if (cell) showScoreFly(cell, points, type);
            else console.warn('未找到单元格:', name, row, col);
        }
        function getCellFromName(name) { const cells=seatingGrid.querySelectorAll('.seat-cell'); for(const cell of cells) if(cell.dataset.name===name) return cell; return null; }
        function showScoreFly(cell, points, type) {
            const rect=cell.getBoundingClientRect(), container=document.getElementById('mainDisplay'), containerRect=container.getBoundingClientRect();
            const fly=document.createElement('div'); fly.className='score-fly';
            const isPlus=points>0, abs=Math.abs(points);
            if(isPlus){ fly.classList.add('plus'); if(abs===1) fly.classList.add('plus1'); fly.textContent=`+${abs}`; }
            else{ fly.classList.add('minus'); if(abs===1) fly.classList.add('minus1'); fly.textContent=`-${abs}`; }
            fly.style.left=(rect.left-containerRect.left+rect.width/2-20)+'px';
            fly.style.top=(rect.top-containerRect.top-10)+'px';
            container.appendChild(fly);
            setTimeout(()=>{ if(fly.parentNode) fly.remove(); },1800);
        }
        function getNeighbors(row,col) {
            const result=[], dirs=[[-1,0],[1,0],[0,-1],[0,1]];
            for(const [dr,dc] of dirs){ const nr=row+dr, nc=col+dc; if(nr>=0&&nr<seatingData.length&&nc>=0&&nc<seatingData[nr].length){ const name=seatingData[nr][nc]?.trim(); if(name&&name!=='') result.push({row:nr,col:nc,name}); } }
            return result;
        }

        // ================================================================
        //  8. 手动点击座次表（略）
        // ================================================================
        function onSeatClick(e) {
            const cell=e.currentTarget; if(cell.classList.contains('empty')) return;
            const row=parseInt(cell.dataset.row), col=parseInt(cell.dataset.col), name=cell.dataset.name;
            if(!name) return;
            if(currentState==='seating'){ selectManual(row,col,name); }
            else if(currentState==='locked'&&lockedCell&&lockedCell.source==='manual'){
                if(lockedCell.row===row&&lockedCell.col===col) return;
                selectManual(row,col,name);
            }else{ showDebug('当前状态不允许手动选择',false); }
        }
        function selectManual(row,col,name){ clearHighlights(); const cell=getCellElement(row,col); if(cell) cell.classList.add('locked'); setState('locked',{row,col,name,source:'manual'}); }

        // ================================================================
        //  9. 音效（略）
        // ================================================================
        let audioCtx=null;
        function getAudioContext(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
        function playBeep(freq,duration){ try{ const ctx=getAudioContext(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value=freq; osc.type='sine'; gain.gain.setValueAtTime(0.08,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration); osc.start(ctx.currentTime); osc.stop(ctx.currentTime+duration); }catch(_){} }

        // ================================================================
        //  10. 事件绑定（略）
        // ================================================================
        btnStart.addEventListener('click',function(){ if(currentState==='idle'||currentState==='seating'||currentState==='scored'){ if(currentState==='seating'||currentState==='scored'){ if(randomTimer){ clearTimeout(randomTimer); randomTimer=null; } clearHighlights(); actionBtns.classList.add('hidden'); btnRandom.disabled=false; isProcessing=false; lockedCell=null; setState('idle'); setTimeout(()=>{ if(currentState==='idle') startCountdown(); },300); return; } startCountdown(); } });
        btnRandom.addEventListener('click',startRandomPick);
        btnEditSeating.addEventListener('click',openEditModal);
        btnResetScores.addEventListener('click',function(){ if(confirm('确定要重置所有同学积分吗？此操作不可撤销！')){ for(const name of allNames) scores[name]=0; saveScoresData(scores); renderLeaderboard(); playBeep(600,0.15); clearHighlights(); actionBtns.classList.add('hidden'); setState('idle'); renderSeating(); showDebug('🔄 积分已重置',false); } });
        btnExportData.addEventListener('click',function(){ const data={seating:seatingData,scores:scores,exportedAt:new Date().toISOString()}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`课堂积分数据_${new Date().toLocaleDateString()}.json`; a.click(); URL.revokeObjectURL(url); showDebug('💾 数据已导出',false); });
        btnImportData.addEventListener('click',function(){ fileInput.click(); });
        fileInput.addEventListener('change',function(e){ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=function(ev){ try{ const data=JSON.parse(ev.target.result); if(data.seating&&Array.isArray(data.seating)&&data.seating.length>0){ if(data.scores&&typeof data.scores==='object'){ seatingData=data.seating; allNames=getAllNamesFromData(seatingData); scores=initScoresForNames(allNames,data.scores); saveSeatingData(seatingData); saveScoresData(scores); renderSeating(); renderLeaderboard(); setState('idle'); playBeep(880,0.15); showDebug('✅ 数据导入成功！',false); }else{ showDebug('❌ 数据格式错误：缺少积分数据',true); } }else{ showDebug('❌ 数据格式错误：座次表数据无效',true); } }catch(err){ showDebug('❌ 文件解析失败：'+err.message,true); } }; reader.readAsText(file); fileInput.value=''; });
        btnModalCancel.addEventListener('click',closeEditModal);
        btnModalSave.addEventListener('click',saveEditModal);
        editModal.addEventListener('click',function(e){ if(e.target===editModal) closeEditModal(); });

        function openEditModal(){ editGrid.innerHTML=''; for(let r=0;r<seatingData.length;r++){ for(let c=0;c<seatingData[r].length;c++){ const input=document.createElement('input'); const val=seatingData[r][c]||''; input.value=val; input.dataset.row=r; input.dataset.col=c; if(val.trim()===''){ input.classList.add('empty-input'); input.placeholder='空'; } input.addEventListener('dblclick',function(){ this.value=''; this.classList.add('empty-input'); this.placeholder='空'; }); input.addEventListener('input',function(){ if(this.value.trim()!==''){ this.classList.remove('empty-input'); this.placeholder=''; }else{ this.classList.add('empty-input'); this.placeholder='空'; } }); editGrid.appendChild(input); } } editModal.classList.add('active'); const firstInput=editGrid.querySelector('input'); if(firstInput) setTimeout(()=>firstInput.focus(),100); }
        function closeEditModal(){ editModal.classList.remove('active'); }
        function saveEditModal(){ const inputs=editGrid.querySelectorAll('input'); const newData=[]; const cols=8; let row=[]; inputs.forEach((input,idx)=>{ const val=input.value.trim(); row.push(val); if((idx+1)%cols===0){ newData.push(row); row=[]; } }); if(row.length>0){ while(row.length<cols) row.push(''); newData.push(row); } const hasData=newData.some(r=>r.some(c=>c.trim()!=='')); if(!hasData){ showDebug('❌ 座次表不能为空，请至少保留一个名字。',true); return; } seatingData=newData; allNames=getAllNamesFromData(seatingData); const newScores={}; for(const name of allNames) newScores[name]=(scores[name]!==undefined)?scores[name]:0; scores=newScores; saveSeatingData(seatingData); saveScoresData(scores); renderSeating(); renderLeaderboard(); setState('idle'); closeEditModal(); playBeep(660,0.12); setTimeout(()=>playBeep(880,0.12),150); showDebug('✅ 座次表已更新',false); }

        // ================================================================
        //  11. 键盘快捷键（略）
        // ================================================================
        document.addEventListener('keydown',function(e){
            if(e.key===' '&&e.target===document.body){ e.preventDefault(); if(currentState==='idle'||currentState==='seating'||currentState==='scored') btnStart.click(); }
            if(e.key==='Enter'&&currentState==='seating'&&!btnRandom.disabled&&!btnRandom.classList.contains('hidden')) btnRandom.click();
            if((e.key==='y'||e.key==='Y')&&currentState==='locked'){ const yesBtn=document.querySelector('.action-btn.btn-yes'); if(yesBtn) yesBtn.click(); }
            if((e.key==='n'||e.key==='N')&&currentState==='locked'){ const noBtn=document.querySelector('.action-btn.btn-no'); if(noBtn) noBtn.click(); }
            if(e.key==='Escape'){ if(editModal.classList.contains('active')) closeEditModal(); if(currentState==='locked'&&lockedCell&&lockedCell.source==='manual'){ const cancelBtn=document.querySelector('.action-btn.btn-cancel'); if(cancelBtn) cancelBtn.click(); } }
        });

        // ================================================================
        //  12. 初始化
        // ================================================================
        function init(){
            initData(); renderQuoteAndCountdown(); renderSeating(); renderLeaderboard(); setState('idle');
            setInterval(()=>{ renderQuoteAndCountdown(); },3600000);
            const now=new Date(); const nextMidnight=new Date(now); nextMidnight.setHours(24,0,0,0); const msToMidnight=nextMidnight-now;
            setTimeout(()=>{ renderQuoteAndCountdown(); setInterval(()=>renderQuoteAndCountdown(),86400000); },msToMidnight);
            console.log('✅ 课堂抢答积分系统已启动！'); console.log('📖 名言:',getDailyQuote()); console.log('⏳ 高考倒计时:',getExamCountdown(),'天'); console.log('👥 学生总数:',allNames.length); console.log('💡 快捷键: 空格=开始, Enter=随机, Y=加分, N=扣分(随机), Esc=取消手动选中'); showDebug('🚀 系统已启动，点击「开始抢答」',false);
        }
        init();
    </script>
</body>
</html>
