<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 数字节拍器</title>
    <style>
        /* ----- 全局重置 & 主题 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 30%, #2b3a67, #0f172a);
            padding: 20px;
        }

        /* ----- 主卡片 ----- */
        .metronome {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 36px 40px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }

        /* ----- 标题 ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #f0f4ff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
        }
        .bpm-display {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            min-width: 80px;
            text-align: center;
        }

        /* ----- 节拍大圆 ----- */
        .beat-circle-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .beat-circle {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #2d3f6b, #18233a);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 -4px 12px rgba(0, 0, 0, 0.4),
                inset 0 4px 12px rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.15s, background 0.15s;
            border: 2px solid rgba(255, 255, 255, 0.04);
        }
        .beat-circle .beat-number {
            font-size: 62px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: color 0.15s;
        }
        .beat-circle .beat-label {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            margin-top: 2px;
        }
        /* 强拍颜色 */
        .beat-circle.strong {
            background: radial-gradient(circle at 40% 35%, #e85050, #a02020);
            box-shadow:
                0 10px 50px rgba(232, 80, 80, 0.35),
                inset 0 -4px 12px rgba(0, 0, 0, 0.4),
                inset 0 4px 12px rgba(255, 255, 255, 0.08);
        }
        .beat-circle.strong .beat-number {
            color: #fff;
        }
        /* 弱拍颜色 */
        .beat-circle.weak {
            background: radial-gradient(circle at 40% 35%, #3a6ba5, #1d3a5f);
            box-shadow:
                0 10px 40px rgba(58, 107, 165, 0.25),
                inset 0 -4px 12px rgba(0, 0, 0, 0.4),
                inset 0 4px 12px rgba(255, 255, 255, 0.05);
        }
        .beat-circle.weak .beat-number {
            color: #d6e8ff;
        }
        /* 脉冲动画 */
        .beat-circle.pulse {
            animation: pulse 0.12s ease-out;
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.06);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ----- 拍点指示器 (小圆点) ----- */
        .beat-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            height: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .beat-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
            transition: all 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .beat-dot.active {
            background: #6a9fd8;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(106, 159, 216, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .beat-dot.active.strong-dot {
            background: #e85050;
            box-shadow: 0 0 24px rgba(232, 80, 80, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .beat-dot.strong-dot {
            background: rgba(232, 80, 80, 0.25);
            border-color: rgba(232, 80, 80, 0.15);
        }

        /* ----- 控制区 ----- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 28px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .control-group .control-header .value {
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            min-width: 48px;
            text-align: right;
        }
        .control-group .control-header .value small {
            font-weight: 400;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 2px;
        }

        /* 自定义滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.12);
            outline: none;
            transition: background 0.2s;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #8ab4ff, #4a7fc7);
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(74, 127, 199, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #8ab4ff, #4a7fc7);
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(74, 127, 199, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        /* 音量滑块颜色特殊 */
        input[type="range"].volume-slider::-webkit-slider-thumb {
            background: radial-gradient(circle at 35% 35%, #f0b37a, #d4874a);
            box-shadow: 0 2px 12px rgba(212, 135, 74, 0.4);
        }
        input[type="range"].volume-slider::-moz-range-thumb {
            background: radial-gradient(circle at 35% 35%, #f0b37a, #d4874a);
            box-shadow: 0 2px 12px rgba(212, 135, 74, 0.4);
        }

        /* 模式选择器 */
        .mode-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .mode-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 0;
            border-radius: 30px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
        }
        .mode-btn.active {
            background: rgba(74, 127, 199, 0.25);
            border-color: rgba(74, 127, 199, 0.5);
            color: #fff;
            box-shadow: 0 0 30px rgba(74, 127, 199, 0.08);
        }
        .mode-btn .sub {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.5;
            display: block;
            margin-top: 1px;
        }

        /* ----- 开始/停止按钮 ----- */
        .action-btn {
            width: 100%;
            padding: 16px 0;
            border-radius: 60px;
            border: none;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s;
            background: linear-gradient(135deg, #4a7fc7, #2d5a8f);
            color: #fff;
            box-shadow: 0 6px 30px rgba(74, 127, 199, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(74, 127, 199, 0.35);
        }
        .action-btn:active {
            transform: translateY(0px);
        }
        .action-btn.running {
            background: linear-gradient(135deg, #d44a4a, #a02020);
            box-shadow: 0 6px 30px rgba(212, 74, 74, 0.25);
        }
        .action-btn.running:hover {
            box-shadow: 0 10px 40px rgba(212, 74, 74, 0.35);
        }
        .action-btn .icon {
            font-size: 24px;
            line-height: 1;
        }

        /* ----- 底部信息 ----- */
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 18px;
        }
        .footer-info .beat-time {
            color: rgba(255, 255, 255, 0.35);
        }
        .footer-info .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-info .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }
        .footer-info .status .dot.running {
            background: #5fcf7a;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ----- 响应式 ----- */
        @media (max-width: 480px) {
            .metronome {
                padding: 24px 20px 28px;
                border-radius: 32px;
            }
            .beat-circle {
                width: 130px;
                height: 130px;
            }
            .beat-circle .beat-number {
                font-size: 48px;
            }
            .beat-dots {
                gap: 8px;
                height: 20px;
            }
            .beat-dot {
                width: 12px;
                height: 12px;
            }
            .header h1 {
                font-size: 18px;
            }
            .bpm-display {
                font-size: 22px;
                min-width: 64px;
                padding: 2px 12px;
            }
            .mode-btn {
                font-size: 13px;
                padding: 8px 0;
                min-width: 50px;
            }
            .action-btn {
                font-size: 17px;
                padding: 14px 0;
            }
        }
        @media (max-width: 380px) {
            .beat-circle {
                width: 110px;
                height: 110px;
            }
            .beat-circle .beat-number {
                font-size: 40px;
            }
            .beat-dots {
                gap: 6px;
            }
            .beat-dot {
                width: 10px;
                height: 10px;
            }
            .metronome {
                padding: 18px 14px 22px;
            }
        }
    </style>
</head>
<body>

    <div class="metronome" id="app">
        <!-- 标题 -->
        <div class="header">
            <h1>
                🎵 节拍器
                <span>v1</span>
            </h1>
            <div class="bpm-display" id="bpmDisplay">120</div>
        </div>

        <!-- 节拍大圆 -->
        <div class="beat-circle-wrapper">
            <div class="beat-circle strong" id="beatCircle">
                <div class="beat-number" id="beatNumber">1</div>
                <div class="beat-label" id="beatLabel">强拍</div>
            </div>
        </div>

        <!-- 拍点指示器 -->
        <div class="beat-dots" id="beatDots"></div>

        <!-- 控制区 -->
        <div class="controls">
            <!-- BPM -->
            <div class="control-group">
                <div class="control-header">
                    <span>速度 (BPM)</span>
                    <span class="value" id="bpmValue">120</span>
                </div>
                <input type="range" id="bpmSlider" min="30" max="240" value="120" step="1" />
            </div>

            <!-- 节拍模式 -->
            <div class="control-group">
                <div class="control-header">
                    <span>节拍模式</span>
                    <span class="value" id="modeLabel" style="font-weight:400;font-size:13px;color:rgba(255,255,255,0.5);">
                        每小节 <span id="beatsPerBarLabel">4</span> 拍
                    </span>
                </div>
                <div class="mode-selector" id="modeSelector">
                    <button class="mode-btn" data-mode="2" data-label="2/4">
                        2/4
                        <span class="sub">二拍</span>
                    </button>
                    <button class="mode-btn active" data-mode="4" data-label="4/4">
                        4/4
                        <span class="sub">四拍</span>
                    </button>
                    <button class="mode-btn" data-mode="3" data-label="3/4">
                        3/4
                        <span class="sub">三拍</span>
                    </button>
                    <button class="mode-btn" data-mode="6" data-label="6/8">
                        6/8
                        <span class="sub">六拍</span>
                    </button>
                </div>
            </div>

            <!-- 音量 -->
            <div class="control-group">
                <div class="control-header">
                    <span>音量</span>
                    <span class="value" id="volumeValue">80<small>%</small></span>
                </div>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" step="1" />
            </div>
        </div>

        <!-- 开始/停止 -->
        <button class="action-btn" id="actionBtn">
            <span class="icon">▶</span>
            <span id="actionLabel">开始</span>
        </button>

        <!-- 底部信息 -->
        <div class="footer-info">
            <span class="beat-time" id="beatTimeInfo">每拍 500 ms</span>
            <span class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusLabel">就绪</span>
            </span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ----- DOM 引用 -----
            const bpmSlider = document.getElementById('bpmSlider');
            const bpmDisplay = document.getElementById('bpmDisplay');
            const bpmValue = document.getElementById('bpmValue');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeValue = document.getElementById('volumeValue');
            const actionBtn = document.getElementById('actionBtn');
            const actionLabel = document.getElementById('actionLabel');
            const beatCircle = document.getElementById('beatCircle');
            const beatNumber = document.getElementById('beatNumber');
            const beatLabel = document.getElementById('beatLabel');
            const beatDots = document.getElementById('beatDots');
            const modeSelector = document.getElementById('modeSelector');
            const modeLabel = document.getElementById('modeLabel');
            const beatsPerBarLabel = document.getElementById('beatsPerBarLabel');
            const beatTimeInfo = document.getElementById('beatTimeInfo');
            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');

            // ----- 状态 -----
            let bpm = 120;
            let volume = 80;
            let beatsPerBar = 4; // 2, 3, 4, 6
            let currentBeat = 0; // 0-based
            let isRunning = false;
            let timerId = null;
            let audioCtx = null;

            // 用于精确节拍的 time 基准
            let nextBeatTime = 0;
            let beatInterval = 0;

            // ----- 音频 -----
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            function playClick(frequency, gainValue) {
                try {
                    const ctx = initAudio();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.type = 'sine';
                    osc.frequency.value = frequency;

                    const vol = Math.max(0, Math.min(1, gainValue / 100));
                    // 最大振幅 0.5，防止破音
                    const amplitude = vol * 0.45;

                    const now = ctx.currentTime;
                    gain.gain.setValueAtTime(amplitude, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                    osc.start(now);
                    osc.stop(now + 0.06);

                    // 小概率清理
                    setTimeout(() => {
                        try { osc.disconnect();
                            gain.disconnect(); } catch (_) {}
                    }, 100);
                } catch (e) {
                    // 静默处理音频错误
                }
            }

            // ----- 节拍逻辑 -----
            function getStrongBeatIndexes() {
                // 返回强拍索引 (0-based)
                if (beatsPerBar === 6) {
                    // 6/8: 第1拍和第4拍为重音
                    return [0, 3];
                }
                // 其他: 只有第1拍为强拍
                return [0];
            }

            function isStrongBeat(index) {
                return getStrongBeatIndexes().includes(index);
            }

            function getFrequency(index) {
                return isStrongBeat(index) ? 880 : 520;
            }

            function getGain(index) {
                // 强拍音量稍大
                return isStrongBeat(index) ? volume : volume * 0.75;
            }

            // ----- 更新UI -----
            function updateBeatDisplay() {
                const beatNum = currentBeat + 1;
                const isStrong = isStrongBeat(currentBeat);
                beatNumber.textContent = beatNum;
                beatLabel.textContent = isStrong ? '● 强拍' : '○ 弱拍';

                // 圆环样式
                beatCircle.classList.remove('strong', 'weak', 'pulse');
                if (isStrong) {
                    beatCircle.classList.add('strong');
                } else {
                    beatCircle.classList.add('weak');
                }
                // 触发脉冲
                void beatCircle.offsetWidth;
                beatCircle.classList.add('pulse');

                // 拍点指示器
                const dots = beatDots.querySelectorAll('.beat-dot');
                dots.forEach((dot, i) => {
                    dot.classList.remove('active', 'strong-dot');
                    if (i === currentBeat) {
                        dot.classList.add('active');
                        if (isStrongBeat(i)) {
                            dot.classList.add('strong-dot');
                        }
                    } else if (isStrongBeat(i)) {
                        dot.classList.add('strong-dot');
                    }
                });

                // 状态灯闪烁
                statusDot.classList.add('running');
                statusLabel.textContent = '运行中';
            }

            function updateDots() {
                beatDots.innerHTML = '';
                for (let i = 0; i < beatsPerBar; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'beat-dot';
                    if (isStrongBeat(i)) {
                        dot.classList.add('strong-dot');
                    }
                    if (i === currentBeat) {
                        dot.classList.add('active');
                        if (isStrongBeat(i)) {
                            dot.classList.add('strong-dot');
                        }
                    }
                    beatDots.appendChild(dot);
                }
            }

            function updateBPMDisplay() {
                bpmDisplay.textContent = bpm;
                bpmValue.textContent = bpm;
                const ms = Math.round(60000 / bpm);
                beatTimeInfo.textContent = `每拍 ${ms} ms`;
            }

            function updateVolumeDisplay() {
                volumeValue.textContent = Math.round(volume) + '%';
            }

            function updateModeLabel() {
                beatsPerBarLabel.textContent = beatsPerBar;
                // 更新模式按钮高亮
                const btns = modeSelector.querySelectorAll('.mode-btn');
                btns.forEach(btn => {
                    const mode = parseInt(btn.dataset.mode, 10);
                    btn.classList.toggle('active', mode === beatsPerBar);
                });
            }

            function updateStatusText() {
                if (isRunning) {
                    statusLabel.textContent = '运行中';
                    statusDot.classList.add('running');
                } else {
                    statusLabel.textContent = '就绪';
                    statusDot.classList.remove('running');
                }
            }

            // ----- 节拍触发 -----
            function playBeat() {
                const freq = getFrequency(currentBeat);
                const gain = getGain(currentBeat);
                playClick(freq, gain);
                updateBeatDisplay();

                // 前进到下一拍
                currentBeat = (currentBeat + 1) % beatsPerBar;
            }

            // ----- 定时器 (使用自校正 setTimeout) -----
            function startTimer() {
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }

                beatInterval = 60000 / bpm;
                // 使用 performance.now() 获得高精度时间
                const now = performance.now();
                // 计算下一个节拍应该发生的时间：对齐到 beatInterval 的整数倍
                const elapsed = now % beatInterval;
                const delay = (elapsed === 0) ? 0 : (beatInterval - elapsed);

                // 如果延迟太小，直接触发
                if (delay < 5) {
                    // 立即触发一拍，然后重新调度
                    playBeat();
                    scheduleNext(beatInterval - (performance.now() % beatInterval));
                } else {
                    scheduleNext(delay);
                }
            }

            function scheduleNext(delay) {
                if (!isRunning) return;
                timerId = setTimeout(() => {
                    if (!isRunning) return;
                    playBeat();
                    // 重新调度下一拍
                    const now = performance.now();
                    const remaining = beatInterval - (now % beatInterval);
                    // 如果剩余时间太小（<5ms），直接调度一个完整间隔
                    const nextDelay = (remaining < 5) ? beatInterval : remaining;
                    scheduleNext(nextDelay);
                }, Math.max(0, delay));
            }

            // ----- 控制函数 -----
            function startMetronome() {
                if (isRunning) return;

                // 初始化音频上下文（需要用户交互）
                try {
                    initAudio();
                } catch (e) { /* ignore */ }

                isRunning = true;
                currentBeat = 0;
                updateDots();
                updateBeatDisplay();
                updateStatusText();

                // 更新按钮
                actionBtn.classList.add('running');
                actionBtn.querySelector('.icon').textContent = '■';
                actionLabel.textContent = '停止';

                // 启动定时器
                startTimer();
            }

            function stopMetronome() {
                if (!isRunning) return;
                isRunning = false;

                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }

                actionBtn.classList.remove('running');
                actionBtn.querySelector('.icon').textContent = '▶';
                actionLabel.textContent = '开始';

                statusDot.classList.remove('running');
                statusLabel.textContent = '已停止';

                // 重置圆环样式
                beatCircle.classList.remove('strong', 'weak', 'pulse');
                beatCircle.classList.add('strong');
                beatNumber.textContent = '1';
                beatLabel.textContent = '强拍';
                // 重置拍点
                currentBeat = 0;
                updateDots();
                // 重置高亮
                const dots = beatDots.querySelectorAll('.beat-dot');
                dots.forEach((dot, i) => {
                    dot.classList.remove('active');
                    if (i === 0) {
                        dot.classList.add('active', 'strong-dot');
                    } else if (isStrongBeat(i)) {
                        dot.classList.add('strong-dot');
                    }
                });
            }

            function toggleMetronome() {
                if (isRunning) {
                    stopMetronome();
                } else {
                    startMetronome();
                }
            }

            // ----- 事件绑定 -----
            // BPM
            bpmSlider.addEventListener('input', function() {
                bpm = parseInt(this.value, 10);
                updateBPMDisplay();
                // 如果正在运行，重新调度
                if (isRunning) {
                    // 停止当前定时器，用新BPM重启
                    if (timerId) {
                        clearTimeout(timerId);
                        timerId = null;
                    }
                    // 重置当前拍，保持视觉同步
                    // 但不要重置 currentBeat，保持连续性
                    // 重新调度
                    beatInterval = 60000 / bpm;
                    const now = performance.now();
                    const delay = beatInterval - (now % beatInterval);
                    scheduleNext(Math.max(0, delay));
                }
            });

            // 音量
            volumeSlider.addEventListener('input', function() {
                volume = parseFloat(this.value);
                updateVolumeDisplay();
            });

            // 节拍模式
            modeSelector.addEventListener('click', function(e) {
                const btn = e.target.closest('.mode-btn');
                if (!btn) return;
                const mode = parseInt(btn.dataset.mode, 10);
                if (mode === beatsPerBar) return;

                // 如果正在运行，先停止
                if (isRunning) {
                    stopMetronome();
                }

                beatsPerBar = mode;
                currentBeat = 0;
                updateModeLabel();
                updateDots();
                // 更新圆环显示第一拍
                beatCircle.classList.remove('strong', 'weak', 'pulse');
                beatCircle.classList.add('strong');
                beatNumber.textContent = '1';
                beatLabel.textContent = '强拍';
                // 更新拍点高亮
                const dots = beatDots.querySelectorAll('.beat-dot');
                dots.forEach((dot, i) => {
                    dot.classList.remove('active');
                    if (i === 0) {
                        dot.classList.add('active', 'strong-dot');
                    } else if (isStrongBeat(i)) {
                        dot.classList.add('strong-dot');
                    }
                });
                // 更新状态
                statusLabel.textContent = '就绪';
                statusDot.classList.remove('running');
            });

            // 开始/停止按钮
            actionBtn.addEventListener('click', toggleMetronome);

            // 键盘空格键支持
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    toggleMetronome();
                }
            });

            // ----- 初始化 -----
            function init() {
                // 设置初始模式高亮
                updateModeLabel();
                // 初始拍点
                currentBeat = 0;
                updateDots();
                // 初始圆环
                beatCircle.classList.add('strong');
                beatNumber.textContent = '1';
                beatLabel.textContent = '强拍';
                // 拍点高亮第一拍
                const dots = beatDots.querySelectorAll('.beat-dot');
                dots.forEach((dot, i) => {
                    if (i === 0) {
                        dot.classList.add('active', 'strong-dot');
                    } else if (isStrongBeat(i)) {
                        dot.classList.add('strong-dot');
                    }
                });
                // 显示
                updateBPMDisplay();
                updateVolumeDisplay();
                updateStatusText();
                // 音量滑块初始值
                volumeSlider.value = volume;
                bpmSlider.value = bpm;
            }

            init();

            // 页面关闭前停止音频
            window.addEventListener('beforeunload', function() {
                if (isRunning) stopMetronome();
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.close();
                }
            });

        })();
    </script>

</body>
</html>
