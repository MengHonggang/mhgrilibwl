<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多页电子黑板 · 白色默认 · 多页PDF</title>
    <!-- 引入 html2canvas 和 jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 12px;
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1300px;
            height: 96vh;
            max-height: 950px;
        }

        .blackboard-container {
            background: #1a3425;
            padding: 14px 14px 18px;
            border-radius: 36px 36px 24px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 0 2px #3a5a44 inset;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .blackboard {
            background: #0f261a;
            border-radius: 20px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 4px 8px rgba(0, 0, 0, 0.4);
            padding: 6px;
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 350px;
        }

        .canvas-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            touch-action: none;
            cursor: grab;
        }

        .canvas-wrapper:active {
            cursor: grabbing;
        }

        #blackboardCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0f261a;
            border-radius: 16px;
            touch-action: none;
            transform-origin: 0 0;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30"><circle cx="12" cy="12" r="8" fill="white" opacity="0.8"/><path d="M4 28 L20 28 L16 20 L8 20 Z" fill="white" opacity="0.6"/></svg>') 12 12, auto;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 14px;
            padding: 8px 16px;
            background: #1f3a2b;
            border-radius: 40px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 6px 12px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            backdrop-filter: blur(2px);
            margin-top: 6px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tool-label {
            color: #dce8d0;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.6);
        }

        input[type="range"] {
            width: 70px;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: #b0c4a4;
            border-radius: 10px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: #eef5e6;
            border-radius: 50%;
            border: 2px solid #14281d;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            background: #eef5e6;
            border-radius: 50%;
            border: 2px solid #14281d;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .size-indicator {
            min-width: 28px;
            text-align: center;
            font-weight: 600;
            color: #e0ecd4;
            background: #1a3224;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.75rem;
            border: 1px solid #446a48;
        }

        /* 鲜明色盘 - 白色默认 */
        .color-palette {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #5d7d60;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .color-swatch:hover {
            transform: scale(1.15);
            border-color: #bfdfb0;
        }

        .color-swatch.active {
            border-color: #ffffff;
            box-shadow: 0 0 14px rgba(255, 255, 240, 0.7);
            transform: scale(1.1);
        }

        .action-btn {
            background: #3f6045;
            border: none;
            color: #f0f7ea;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a2f1f, 0 6px 12px rgba(0, 0, 0, 0.3);
            transition: 0.08s linear;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #6b906e;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #1a2f1f, 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            background: #4f7a56;
            color: white;
        }

        .action-btn.eraser-btn.active {
            background: #8f7a5a;
            border-color: #c4a77a;
            box-shadow: 0 3px 0 #5c4a30;
        }

        .action-btn.clear-btn {
            background: #5d413d;
            border-color: #8a6360;
            box-shadow: 0 3px 0 #342724;
        }
        .action-btn.clear-btn:hover {
            background: #785753;
        }

        .action-btn.save-btn {
            background: #3f5a6b;
            border-color: #6e8fa1;
            box-shadow: 0 3px 0 #263a47;
        }
        .action-btn.save-btn:hover {
            background: #52758b;
        }

        .action-btn.page-btn {
            background: #4f5f4a;
            border-color: #7d9375;
            box-shadow: 0 3px 0 #2d3a29;
        }
        .action-btn.page-btn:hover {
            background: #637a5c;
        }

        .page-indicator {
            color: #d0dfc4;
            font-size: 0.8rem;
            background: #1f3829;
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid #4a6b4a;
            font-weight: 600;
            min-width: 60px;
            text-align: center;
        }

        .zoom-indicator {
            color: #d0dfc4;
            font-size: 0.75rem;
            background: #1f3829;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid #4a6b4a;
            min-width: 44px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .toolbar {
                gap: 5px 10px;
                padding: 6px 12px;
            }
            .color-swatch {
                width: 22px;
                height: 22px;
            }
            .action-btn {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            input[type="range"] {
                width: 55px;
            }
        }
        @media (max-width: 600px) {
            .toolbar {
                gap: 4px 6px;
                padding: 4px 8px;
                border-radius: 30px;
            }
            .color-swatch {
                width: 18px;
                height: 18px;
                border-width: 1.5px;
            }
            .tool-label {
                font-size: 0.65rem;
            }
            .action-btn {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            .page-indicator,
            .zoom-indicator {
                font-size: 0.65rem;
                padding: 1px 8px;
                min-width: 40px;
            }
            .size-indicator {
                font-size: 0.65rem;
                min-width: 22px;
                padding: 1px 6px;
            }
            input[type="range"] {
                width: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="blackboard-container">
            <div class="blackboard">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="blackboardCanvas" width="1600" height="1000"></canvas>
                </div>
            </div>

            <div class="toolbar">
                <!-- 粗细 -->
                <div class="tool-group">
                    <span class="tool-label">✏️</span>
                    <input type="range" id="sizeSlider" min="2" max="40" value="8" step="0.5">
                    <span class="size-indicator" id="sizeDisplay">8</span>
                </div>

                <!-- 鲜明色盘 + 白色默认 -->
                <div class="tool-group">
                    <span class="tool-label">🎨</span>
                    <div class="color-palette" id="colorPalette"></div>
                </div>

                <!-- 橡皮擦 -->
                <div class="tool-group">
                    <button class="action-btn eraser-btn" id="eraserBtn">🧹 橡皮</button>
                </div>

                <!-- 页面管理 -->
                <div class="tool-group">
                    <button class="action-btn page-btn" id="prevPageBtn">◀</button>
                    <span class="page-indicator" id="pageIndicator">1 / 1</span>
                    <button class="action-btn page-btn" id="nextPageBtn">▶</button>
                    <button class="action-btn page-btn" id="addPageBtn">＋ 页</button>
                </div>

                <!-- 缩放 -->
                <div class="tool-group">
                    <button class="action-btn page-btn" id="zoomInBtn">🔍+</button>
                    <span class="zoom-indicator" id="zoomDisplay">100%</span>
                    <button class="action-btn page-btn" id="zoomOutBtn">🔍−</button>
                    <button class="action-btn page-btn" id="resetViewBtn">⟲</button>
                </div>

                <!-- 清除 & 保存 -->
                <div class="tool-group">
                    <button class="action-btn clear-btn" id="clearBtn">🧽 清除</button>
                    <button class="action-btn save-btn" id="savePdfBtn">📄 PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM ----------
            const canvas = document.getElementById('blackboardCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('canvasWrapper');

            const sizeSlider = document.getElementById('sizeSlider');
            const sizeDisplay = document.getElementById('sizeDisplay');
            const eraserBtn = document.getElementById('eraserBtn');
            const clearBtn = document.getElementById('clearBtn');
            const savePdfBtn = document.getElementById('savePdfBtn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetViewBtn = document.getElementById('resetViewBtn');
            const zoomDisplay = document.getElementById('zoomDisplay');
            const colorPalette = document.getElementById('colorPalette');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const addPageBtn = document.getElementById('addPageBtn');
            const pageIndicator = document.getElementById('pageIndicator');

            // ---------- 常量 ----------
            const CANVAS_W = 1600;
            const CANVAS_H = 1000;
            canvas.width = CANVAS_W;
            canvas.height = CANVAS_H;

            // ---------- 鲜明颜色 (白色默认 + 红绿黄蓝等) ----------
            const COLORS = [
                '#FFFFFF', // 白色 (默认)
                '#FF0000', // 红
                '#00CC00', // 绿
                '#FFD700', // 金黄
                '#1E90FF', // 亮蓝
                '#FF8C00', // 橙
                '#FF1493', // 粉红
                '#32CD32', // 鲜绿
                '#4169E1', // 皇家蓝
                '#FF4500', // 橙红
                '#9370DB', // 中紫
                '#00CED1', // 深天蓝
                '#FF6347', // 番茄红
                '#7CFC00', // 草绿
                '#FF69B4' // 亮粉红
            ];

            // ---------- 多页数据 ----------
            let pages = [];
            let currentPageIndex = 0;

            // 保存当前页为图片数据
            function saveCurrentPage() {
                pages[currentPageIndex] = canvas.toDataURL('image/png');
            }

            // 加载指定页
            function loadPage(index) {
                if (index < 0 || index >= pages.length) return;
                currentPageIndex = index;
                const imgData = pages[index];
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
                    ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
                    updatePageIndicator();
                };
                img.onerror = function() {
                    // 如果图片加载失败，重置为空白
                    ctx.fillStyle = '#0f261a';
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                    updatePageIndicator();
                };
                img.src = imgData;
            }

            // 添加新页 (空白)
            function addNewPage() {
                saveCurrentPage();
                // 创建空白页数据
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = CANVAS_W;
                tempCanvas.height = CANVAS_H;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.fillStyle = '#0f261a';
                tempCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                const blankData = tempCanvas.toDataURL('image/png');
                pages.push(blankData);
                currentPageIndex = pages.length - 1;
                loadPage(currentPageIndex);
                updatePageIndicator();
                resetView();
            }

            // 删除当前页 (至少保留一页)
            function deleteCurrentPage() {
                if (pages.length <= 1) {
                    // 清空当前页
                    ctx.fillStyle = '#0f261a';
                    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                    saveCurrentPage();
                    return;
                }
                pages.splice(currentPageIndex, 1);
                if (currentPageIndex >= pages.length) {
                    currentPageIndex = pages.length - 1;
                }
                loadPage(currentPageIndex);
                updatePageIndicator();
            }

            function updatePageIndicator() {
                pageIndicator.textContent = `${currentPageIndex + 1} / ${pages.length}`;
            }

            // ---------- 初始化页面 ----------
            function initPages() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = CANVAS_W;
                tempCanvas.height = CANVAS_H;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.fillStyle = '#0f261a';
                tempCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                pages.push(tempCanvas.toDataURL('image/png'));
                currentPageIndex = 0;
                loadPage(0);
                updatePageIndicator();
            }

            // ---------- 变换状态 ----------
            let scale = 1.0;
            let translateX = 0;
            let translateY = 0;

            let isPanning = false;
            let panStartX = 0,
                panStartY = 0;
            let panStartTranslateX = 0,
                panStartTranslateY = 0;

            // ---------- 更新画布变换 ----------
            function updateTransform() {
                canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                zoomDisplay.textContent = Math.round(scale * 100) + '%';
            }

            function resetView() {
                scale = 1.0;
                translateX = 0;
                translateY = 0;
                updateTransform();
            }

            // ---------- 坐标转换 ----------
            function getCanvasCoords(clientX, clientY) {
                const rect = wrapper.getBoundingClientRect();
                const xRatio = (clientX - rect.left) / rect.width;
                const yRatio = (clientY - rect.top) / rect.height;
                const logicalX = (xRatio * CANVAS_W - translateX) / scale;
                const logicalY = (yRatio * CANVAS_H - translateY) / scale;
                return {
                    x: Math.min(Math.max(logicalX, 0), CANVAS_W),
                    y: Math.min(Math.max(logicalY, 0), CANVAS_H)
                };
            }

            // ---------- 绘制 ----------
            let isDrawing = false;
            let lastX = 0,
                lastY = 0;
            let currentSize = parseFloat(sizeSlider.value);
            let currentColor = '#FFFFFF'; // 默认白色
            let isEraser = false;

            function drawLine(x1, y1, x2, y2, size, color) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            function eraseLine(x1, y1, x2, y2, size) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#0f261a';
                ctx.lineWidth = size * 1.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // ---------- 事件 ----------
            function startDrawing(e) {
                e.preventDefault();
                const pos = getEventPos(e);
                if (!pos) return;
                isDrawing = true;
                lastX = pos.x;
                lastY = pos.y;
                if (isEraser) {
                    ctx.beginPath();
                    ctx.arc(lastX, lastY, currentSize * 0.9, 0, 2 * Math.PI);
                    ctx.fillStyle = '#0f261a';
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(lastX, lastY, currentSize / 2, 0, 2 * Math.PI);
                    ctx.fillStyle = currentColor;
                    ctx.fill();
                }
            }

            function draw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const pos = getEventPos(e);
                if (!pos) return;
                const currentX = pos.x;
                const currentY = pos.y;
                if (isEraser) {
                    eraseLine(lastX, lastY, currentX, currentY, currentSize);
                } else {
                    drawLine(lastX, lastY, currentX, currentY, currentSize, currentColor);
                }
                lastX = currentX;
                lastY = currentY;
            }

            function stopDrawing(e) {
                e.preventDefault();
                if (isDrawing) {
                    isDrawing = false;
                    saveCurrentPage();
                }
            }

            function getEventPos(e) {
                let clientX, clientY;
                if (e.touches) {
                    if (e.touches.length === 0) return null;
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return getCanvasCoords(clientX, clientY);
            }

            // ---------- 平移 ----------
            function startPan(e) {
                if (e.button !== undefined && e.button !== 0) return;
                if (isDrawing) return;
                e.preventDefault();
                const clientX = e.clientX || e.touches?.[0]?.clientX;
                const clientY = e.clientY || e.touches?.[0]?.clientY;
                if (clientX === undefined) return;
                isPanning = true;
                panStartX = clientX;
                panStartY = clientY;
                panStartTranslateX = translateX;
                panStartTranslateY = translateY;
                wrapper.style.cursor = 'grabbing';
            }

            function movePan(e) {
                if (!isPanning) return;
                e.preventDefault();
                const clientX = e.clientX || e.touches?.[0]?.clientX;
                const clientY = e.clientY || e.touches?.[0]?.clientY;
                if (clientX === undefined) return;
                const dx = clientX - panStartX;
                const dy = clientY - panStartY;
                translateX = panStartTranslateX + dx;
                translateY = panStartTranslateY + dy;
                updateTransform();
            }

            function endPan(e) {
                if (isPanning) {
                    isPanning = false;
                    wrapper.style.cursor = 'grab';
                }
            }

            // ---------- 缩放 ----------
            function zoomAt(factor, centerX, centerY) {
                const oldScale = scale;
                const newScale = Math.min(Math.max(scale * factor, 0.15), 5.0);
                if (newScale === oldScale) return;
                const rect = wrapper.getBoundingClientRect();
                const cx = centerX !== undefined ? centerX : rect.width / 2;
                const cy = centerY !== undefined ? centerY : rect.height / 2;
                const logicalX = (cx / rect.width * CANVAS_W - translateX) / oldScale;
                const logicalY = (cy / rect.height * CANVAS_H - translateY) / oldScale;
                scale = newScale;
                translateX = cx / rect.width * CANVAS_W - logicalX * scale;
                translateY = cy / rect.height * CANVAS_H - logicalY * scale;
                updateTransform();
            }

            // ---------- 绑定事件 ----------
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing, { passive: false });
            canvas.addEventListener('touchcancel', stopDrawing, { passive: false });

            wrapper.addEventListener('mousedown', startPan);
            window.addEventListener('mousemove', movePan);
            window.addEventListener('mouseup', endPan);

            wrapper.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1 && !isDrawing) {
                    startPan(e);
                }
            }, { passive: false });
            wrapper.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && !isDrawing) {
                    movePan(e);
                }
            }, { passive: false });
            wrapper.addEventListener('touchend', endPan, { passive: false });
            wrapper.addEventListener('touchcancel', endPan, { passive: false });

            wrapper.addEventListener('wheel', function(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const rect = wrapper.getBoundingClientRect();
                zoomAt(delta, e.clientX - rect.left, e.clientY - rect.top);
            }, { passive: false });

            canvas.addEventListener('contextmenu', e => e.preventDefault());

            // ---------- UI 控制 ----------
            sizeSlider.addEventListener('input', function() {
                currentSize = parseFloat(this.value);
                sizeDisplay.textContent = currentSize;
            });

            // 色盘 - 白色默认高亮
            function buildPalette() {
                colorPalette.innerHTML = '';
                COLORS.forEach(c => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.background = c;
                    // 白色默认为激活状态
                    if (c === '#FFFFFF') {
                        swatch.classList.add('active');
                    }
                    swatch.addEventListener('click', function() {
                        document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove(
                        'active'));
                        this.classList.add('active');
                        currentColor = c;
                        if (isEraser) {
                            isEraser = false;
                            eraserBtn.classList.remove('active');
                            eraserBtn.innerHTML = '🧹 橡皮';
                            canvas.style.cursor =
                                'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'30\' viewBox=\'0 0 24 30\'><circle cx=\'12\' cy=\'12\' r=\'8\' fill=\'white\' opacity=\'0.8\'/><path d=\'M4 28 L20 28 L16 20 L8 20 Z\' fill=\'white\' opacity=\'0.6\'/></svg>") 12 12, auto';
                        }
                    });
                    colorPalette.appendChild(swatch);
                });
            }
            buildPalette();

            eraserBtn.addEventListener('click', function() {
                isEraser = !isEraser;
                this.classList.toggle('active');
                this.innerHTML = isEraser ? '🧹 橡皮 (开)' : '🧹 橡皮';
                canvas.style.cursor = isEraser ?
                    'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'30\' height=\'30\' viewBox=\'0 0 30 30\'><circle cx=\'15\' cy=\'15\' r=\'12\' fill=\'%23b3a68a\' opacity=\'0.5\'/><circle cx=\'15\' cy=\'15\' r=\'6\' fill=\'%23907d60\'/></svg>") 15 15, auto' :
                    'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'30\' viewBox=\'0 0 24 30\'><circle cx=\'12\' cy=\'12\' r=\'8\' fill=\'white\' opacity=\'0.8\'/><path d=\'M4 28 L20 28 L16 20 L8 20 Z\' fill=\'white\' opacity=\'0.6\'/></svg>") 12 12, auto';
                if (isEraser) {
                    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
                } else {
                    document.querySelectorAll('.color-swatch').forEach(el => {
                        if (el.style.background === currentColor) el.classList.add('active');
                    });
                }
            });

            clearBtn.addEventListener('click', function() {
                ctx.fillStyle = '#0f261a';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                saveCurrentPage();
            });

            canvas.addEventListener('dblclick', function() {
                ctx.fillStyle = '#0f261a';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                saveCurrentPage();
            });

            // 页面控制
            prevPageBtn.addEventListener('click', function() {
                if (currentPageIndex > 0) {
                    saveCurrentPage();
                    loadPage(currentPageIndex - 1);
                    resetView();
                }
            });

            nextPageBtn.addEventListener('click', function() {
                if (currentPageIndex < pages.length - 1) {
                    saveCurrentPage();
                    loadPage(currentPageIndex + 1);
                    resetView();
                }
            });

            addPageBtn.addEventListener('click', addNewPage);

            // 缩放
            zoomInBtn.addEventListener('click', function() {
                const rect = wrapper.getBoundingClientRect();
                zoomAt(1.2, rect.width / 2, rect.height / 2);
            });
            zoomOutBtn.addEventListener('click', function() {
                const rect = wrapper.getBoundingClientRect();
                zoomAt(0.8, rect.width / 2, rect.height / 2);
            });
            resetViewBtn.addEventListener('click', resetView);

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && (e.key === 'd' || e.key === 'D')) {
                    e.preventDefault();
                    if (confirm('确定要删除当前页吗？')) {
                        deleteCurrentPage();
                    }
                }
                if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) {
                    e.preventDefault();
                    addNewPage();
                }
            });

            // ---------- 保存 PDF (多页) ----------
            savePdfBtn.addEventListener('click', function() {
                // 先保存当前页
                saveCurrentPage();

                // 保存当前视图状态
                const oldScale = scale;
                const oldTx = translateX;
                const oldTy = translateY;

                // 重置视图以完整截图
                scale = 1;
                translateX = 0;
                translateY = 0;
                updateTransform();

                // 显示加载提示（简单处理）
                const originalText = savePdfBtn.textContent;
                savePdfBtn.textContent = '⏳ 生成中...';
                savePdfBtn.disabled = true;

                // 收集所有页面截图
                const pageImages = [];
                let capturedCount = 0;

                function captureNextPage(index) {
                    if (index >= pages.length) {
                        // 所有页面截图完成，生成PDF
                        generateMultiPagePDF(pageImages);
                        return;
                    }

                    // 加载页面
                    const img = new Image();
                    img.onload = function() {
                        // 绘制到临时canvas
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = CANVAS_W;
                        tempCanvas.height = CANVAS_H;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);

                        // 截取黑板区域
                        const container = document.querySelector('.blackboard-container');
                        html2canvas(container, {
                            scale: 1.5,
                            useCORS: true,
                            backgroundColor: '#1a3425',
                            logging: false,
                            allowTaint: false,
                            width: container.scrollWidth,
                            height: container.scrollHeight
                        }).then((canvasImg) => {
                            pageImages.push(canvasImg.toDataURL('image/png'));
                            capturedCount++;
                            // 更新进度
                            savePdfBtn.textContent = `⏳ ${capturedCount}/${pages.length}`;
                            // 继续截取下一页
                            captureNextPage(index + 1);
                        }).catch(err => {
                            console.error('截图失败:', err);
                            // 继续尝试下一页
                            captureNextPage(index + 1);
                        });
                    };
                    img.onerror = function() {
                        console.error('加载页面图片失败:', index);
                        captureNextPage(index + 1);
                    };
                    img.src = pages[index];
                }

                function generateMultiPagePDF(images) {
                    try {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('landscape', 'mm', 'a4');
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();

                        images.forEach((imgData, idx) => {
                            if (idx > 0) {
                                pdf.addPage();
                            }
                            const img = new Image();
                            img.onload = function() {
                                // 图片已在内存中，直接添加
                                const imgWidth = img.width;
                                const imgHeight = img.height;
                                const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);
                                const width = imgWidth * ratio;
                                const height = imgHeight * ratio;
                                const x = (pdfWidth - width) / 2;
                                const y = (pdfHeight - height) / 2;
                                pdf.addImage(img, 'PNG', x, y, width, height);
                            };
                            img.src = imgData;
                        });

                        // 等待所有图片加载完成再保存
                        let loadedCount = 0;
                        images.forEach((imgData, idx) => {
                            const img = new Image();
                            img.onload = function() {
                                loadedCount++;
                                if (loadedCount === images.length) {
                                    pdf.save('黑板笔记_多页.pdf');
                                    // 恢复UI
                                    savePdfBtn.textContent = originalText;
                                    savePdfBtn.disabled = false;
                                    // 恢复视图
                                    scale = oldScale;
                                    translateX = oldTx;
                                    translateY = oldTy;
                                    updateTransform();
                                }
                            };
                            img.onerror = function() {
                                loadedCount++;
                                if (loadedCount === images.length) {
                                    pdf.save('黑板笔记_多页.pdf');
                                    savePdfBtn.textContent = originalText;
                                    savePdfBtn.disabled = false;
                                    scale = oldScale;
                                    translateX = oldTx;
                                    translateY = oldTy;
                                    updateTransform();
                                }
                            };
                            img.src = imgData;
                        });

                        // 如果images为空，直接保存
                        if (images.length === 0) {
                            pdf.save('黑板笔记_多页.pdf');
                            savePdfBtn.textContent = originalText;
                            savePdfBtn.disabled = false;
                            scale = oldScale;
                            translateX = oldTx;
                            translateY = oldTy;
                            updateTransform();
                        }
                    } catch (e) {
                        alert('生成PDF失败: ' + e.message);
                        savePdfBtn.textContent = originalText;
                        savePdfBtn.disabled = false;
                        scale = oldScale;
                        translateX = oldTx;
                        translateY = oldTy;
                        updateTransform();
                    }
                }

                // 开始截取所有页面
                captureNextPage(0);
            });

            // ---------- 启动 ----------
            initPages();
            resetView();
            sizeDisplay.textContent = currentSize;
            // 白色默认激活
            document.querySelectorAll('.color-swatch').forEach(el => {
                if (el.style.background === '#FFFFFF') el.classList.add('active');
            });
            currentColor = '#FFFFFF';

            console.log('🖤 多页电子黑板 · 白色默认 · 多页PDF保存');
            console.log('💡 快捷键: Ctrl+N 新建页, Ctrl+Shift+D 删除当前页');
        })();
    </script>
</body>
</html>
