<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中 · 访问认证</title>
    <style>
        /* 极简过渡样式，仅用于展示跳转瞬间的提示 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1b2a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e1dd;
            padding: 1rem;
        }
        .card {
            background: #1b263b;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        .card h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .card h1 span {
            background: #2e4a6b;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 400;
        }
        .target-url {
            background: #0d1b2a;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.95rem;
            word-break: break-all;
            color: #a8d5ff;
            border: 1px solid #334e68;
            margin: 1.2rem 0;
        }
        .status {
            font-size: 1.1rem;
            margin-top: 1.8rem;
            padding: 0.75rem;
            border-radius: 40px;
            background: #0d1b2a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #7aa9d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .note {
            margin-top: 1.8rem;
            font-size: 0.8rem;
            color: #7c8b9a;
            border-top: 1px solid #263b4e;
            padding-top: 1.2rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            🔐 访问认证
            <span>跳转中</span>
        </h1>
        <p style="color:#b0c4de; font-size:0.95rem;">正在前往受保护页面</p>
        
        <div class="target-url">
            🌐 https://ur34732611i.vicp.fun
        </div>

        <div class="status" id="statusMessage">
            <span class="spinner"></span> 即将跳转…
        </div>

        <div class="note">
            ⚡ 页面将立即跳转，请稍候。
        </div>
    </div>

    <script>
        (function() {
            // ----- 配置参数 -----
            const TARGET_URL = 'https://ur34732611i.vicp.fun';

            // 更新状态文本（无密码）
            const statusEl = document.getElementById('statusMessage');
            if (statusEl) {
                statusEl.innerHTML = `<span class="spinner"></span> 立即跳转…`;
            }

            // 立即执行跳转（无延迟）
            const performRedirect = () => {
                try {
                    // 使用 replace 避免在历史记录中留下当前页
                    window.location.replace(TARGET_URL);
                } catch (e) {
                    window.location.href = TARGET_URL;
                }
            };

            // 直接跳转，不等待
            performRedirect();

            // 作为后备：如果由于某些原因 replace 未生效，添加 meta refresh 立即跳转
            const meta = document.createElement('meta');
            meta.httpEquiv = 'refresh';
            meta.content = `0; url=${TARGET_URL}`;
            document.head.appendChild(meta);

            // 注意：如果脚本被禁用，meta refresh 也会立即跳转（0秒延迟）
            // 页面中不再显示任何密码信息，也不尝试复制剪贴板
        })();
    </script>
</body>
</html>
